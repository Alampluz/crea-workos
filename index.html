<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREA WorkOS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316181D'/><text x='32' y='45' font-size='36' font-family='Georgia,serif' font-weight='700' fill='white' text-anchor='middle'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F7F7F4; --panel:#FFFFFF; --ink:#16181D; --ink2:#5D6167; --ink3:#9DA1A7;
  --line:#E9E8E3; --accent:#0F766E; --accent-soft:#EAF3F1; --accent-ink:#0B5D57;
  --green:#12915E; --green-soft:#E5F4EC; --red:#C2434F; --red-soft:#FAECEC;
  --amber:#A8770E; --amber-soft:#FBF3DE; --blue:#2A6FB8; --blue-soft:#EAF1F9;
  --purple:#6E56B8; --purple-soft:#F1EDFA; --gray-soft:#F0EFEA;
  --sidebar:#FFFFFF; --sidebar-ink:#5D6167; --sidebar-hover:#F2F2EE;
  --radius:14px; --shadow:0 1px 2px rgba(22,24,29,.05),0 10px 30px rgba(22,24,29,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13.5px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 5px}
label .req{color:var(--red)}
a{color:var(--accent-ink);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CDD0DE;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:248px;min-width:248px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid var(--line)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:58px;min-height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
#content{flex:1;overflow-y:auto;padding:24px 28px}

.logo{display:flex;align-items:center;gap:11px;padding:22px 18px 18px;color:var(--ink)}
.logo-mark{width:34px;height:34px;border-radius:10px;background:#16181D;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;color:#fff;font-family:'Fraunces',Georgia,serif}
.logo b{font-size:16px;letter-spacing:.2px;font-weight:700}
.logo span{display:block;font-size:9.5px;color:var(--ink3);font-weight:600;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}

.nav-section{padding:14px 20px 6px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
.nav-item{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:8px 12px;border-radius:9px;color:var(--sidebar-ink);font-weight:500;font-size:13.5px;cursor:pointer;user-select:none;transition:all .12s}
.nav-item:hover{background:var(--sidebar-hover);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .count{margin-left:auto;background:var(--gray-soft);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.nav-item .count.hot{background:var(--red);color:#fff}
.ws-item{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:7px 12px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--sidebar-ink);transition:all .12s}
.ws-item:hover{background:var(--sidebar-hover);color:var(--ink)}
.ws-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ws-dot{width:8px;min-width:8px;height:8px;border-radius:50%}
.ws-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar-user{margin-top:auto;padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
#sidebar-user .who{flex:1;min-width:0}
#sidebar-user .who b{display:block;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar-user .who span{font-size:10.5px;color:var(--ink3);text-transform:capitalize;letter-spacing:.4px}
#sidebar-user button{color:var(--ink3);padding:6px;border-radius:7px;display:inline-flex;align-items:center}
#sidebar-user button:hover{background:var(--sidebar-hover);color:var(--ink)}

.crumb{font-size:15.5px;font-weight:700}
.crumb span{color:var(--ink3);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---------- shared components ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;font-weight:600;font-size:13.5px;transition:filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn-primary{background:#16181D;color:#fff}
.btn-primary:hover{background:#2A2D34;filter:none}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.avatar{width:28px;height:28px;min-width:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px}
.avatar.sm{width:22px;height:22px;min-width:22px;font-size:9.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty .big{font-size:34px;margin-bottom:10px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:600;font-family:'Fraunces',Georgia,serif;letter-spacing:.2px}
.page-head .sub{color:var(--ink2);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:2px;background:var(--gray-soft);border-radius:9px;padding:3px}
.tab{padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink2)}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,22,40,.1)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover{background:#FAFAF6}

/* table view (spreadsheet grid) */
.tv-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table.tv{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.tv th{white-space:nowrap;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);background:#FBFBF8;position:sticky;top:0;z-index:2}
.tv th.col-edit{cursor:pointer}
.tv th.col-edit:hover{color:var(--accent)}
.tv td{padding:0;border-top:1px solid #F1F1EC;vertical-align:middle;min-width:132px;background:#fff}
.tv td+td{border-left:1px solid #F6F6F1}
.tv tbody tr:first-child td{border-top:none}
.tv tbody tr:hover td{background:#FBFBF7}
.tv td.tv-name{min-width:260px}
.tv td input{width:100%;border:none;background:transparent;padding:11px 14px;font:inherit;color:var(--ink)}
.tv td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff;border-radius:6px}
.tv td input[type=checkbox]{width:auto;margin:13px 14px;accent-color:var(--accent)}
.tv td .tv-open{padding:11px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center}
.tv td .tv-open:hover{color:var(--accent)}
.tv-addcol{padding:4px 10px;font-weight:700;color:var(--ink3);cursor:pointer;white-space:nowrap;border:1px dashed var(--line);border-radius:7px;font-size:11px;letter-spacing:.4px}
.tv-addcol:hover{color:var(--accent);border-color:var(--accent)}

/* grouped table view (monday-style sections) */
.tv-group{margin-bottom:22px}
.tv-group-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tv-group-head .bar{width:4px;height:18px;border-radius:2px}
.tv-group-head h3{font-size:14.5px;font-weight:700}
.tv-group-head .cnt{font-size:12px;color:var(--ink3);font-weight:600}
.tv-group-head .g-edit{font-size:12px;color:var(--ink3);cursor:pointer;font-weight:600;opacity:0;transition:opacity .12s}
.tv-group-head:hover .g-edit{opacity:1}
.tv-group-head .g-edit:hover{color:var(--accent)}
.tv tr.tv-row{cursor:grab}
.tv tr.tv-row.dragging{opacity:.4}
.tv-wrap.dragover{outline:2px solid var(--accent);outline-offset:-2px}
.tv-addtask{padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.tv-addtask:hover{color:var(--accent)}
.tv-addgroup{margin-top:4px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--ink3);cursor:pointer;border:1px dashed var(--line);border-radius:10px;display:inline-block;background:#fff}
.tv-addgroup:hover{color:var(--accent);border-color:var(--accent)}
.tv-archbar{margin-top:18px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer;display:inline-block;border-radius:8px}
.tv-archbar:hover{background:var(--gray-soft);color:var(--ink2)}
tr.tv-arch{opacity:.55}
tr.tv-arch .tv-name .tv-open{text-decoration:line-through}
.tv-restore{margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap}
.tv-restore:hover{text-decoration:underline}
.ws-item{position:relative}
.ws-item .ws-menu{margin-left:auto;opacity:0;color:var(--ink3);font-weight:700;padding:0 4px;border-radius:5px;line-height:1;flex:none}
.ws-item:hover .ws-menu,.ws-item .ws-menu.on{opacity:1}
.ws-item .ws-menu:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.ws-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger-note{background:var(--red-soft);border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--red)}
.tv .subchip{font-size:11.5px;font-weight:700;color:var(--ink3);background:var(--gray-soft);border-radius:6px;padding:2px 7px;margin-left:8px;white-space:nowrap}
.tv-pickv{padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:13px;min-height:40px;display:flex;align-items:center;gap:8px}
.tv-pickv:hover{box-shadow:inset 0 0 0 1px var(--line);border-radius:8px}
.tv-pickv.fillcell{padding:0;border-radius:0}
.tv-pickv.fillcell:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);border-radius:0}
.tv-empty{color:#C9CCD6;font-weight:600}
.tv-fill{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.2px;text-align:center}
.tv-fill-empty{background:#EDEDE7;color:#A9ADBD}
.tv-fill.mini{min-height:0;padding:7px 10px;border-radius:7px;width:100%}
.tv td.tv-check,.tv th.tv-check{min-width:38px;width:38px;text-align:center}
.tv td.tv-check input,.tv th.tv-check input{width:auto;margin:0;accent-color:var(--accent);cursor:pointer}
.tv tbody tr.rowsel td{background:var(--accent-soft)}
.tv tr.tv-row td:first-child{border-left:3px solid var(--gcol, transparent)}
.tv-quickadd{border-top:1px solid #F1F1EC}
.tv-quickadd input{width:100%;border:none;background:transparent;padding:11px 14px 11px 52px;font:inherit;color:var(--ink)}
.tv-quickadd input::placeholder{color:var(--ink3);font-weight:600}
.tv-quickadd input:focus{outline:none;background:#FBFBF7}
#tvbulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:350;background:#16181D;color:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;padding:10px 14px;animation:pop .15s ease}
#tvbulk b{font-size:13px;margin-right:8px;white-space:nowrap}
#tvbulk button{color:#fff;font-weight:600;font-size:12.5px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.12);white-space:nowrap}
#tvbulk button:hover{background:rgba(255,255,255,.24)}
#tvbulk button.danger{background:rgba(214,69,91,.4)}
.tv-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tv-chip .cdot{width:7px;height:7px;border-radius:50%;flex:none}
.tv-link{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.tv-link:hover{border-bottom-color:var(--accent)}
.tv-num{width:100%;text-align:left;font-variant-numeric:tabular-nums}

/* dropdown picker menu */
#tvmenu{position:fixed;z-index:400;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,22,40,.16);min-width:220px;max-width:300px;overflow:hidden;animation:pop .12s ease}
#tvmenu .search{padding:8px;border-bottom:1px solid var(--line)}
#tvmenu .search input{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px}
#tvmenu .opts{max-height:264px;overflow-y:auto;padding:6px}
#tvmenu .opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
#tvmenu .opt:hover{background:var(--gray-soft)}
#tvmenu .opt.clear{color:var(--ink3);font-weight:600}

/* collapsible groups */
.tv-group-head .caret{font-size:11px;color:var(--ink3);cursor:pointer;width:18px;text-align:center;user-select:none}
.tv-group-head h3{cursor:pointer}
.tv-group.collapsed .tv-wrap{display:none}

/* subtasks in task modal */
.strow{display:grid;grid-template-columns:118px 1fr 110px 140px 128px 26px;gap:6px;align-items:center;margin-top:6px}
.strow select,.strow input{padding:7px 9px;font-size:12.5px}
.strow .del{color:var(--ink3);font-size:13px;padding:4px;border-radius:6px;cursor:pointer}
.strow .del:hover{color:var(--red)}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.prog-bar{flex:1;height:6px;background:var(--gray-soft);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.prog-lbl{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}

/* dashboard widgets */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:12px}
.widget-card{position:relative}
.widget-card.w-wide{grid-column:span 2}
@media (max-width:900px){.widget-card.w-wide{grid-column:auto}}
.w-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.w-head h3{font-size:13.5px;font-weight:700;flex:1}
.w-actions{display:flex;gap:10px;font-size:12px;font-weight:600;color:var(--ink3);opacity:0;transition:opacity .12s}
.widget-card:hover .w-actions{opacity:1}
.w-actions span{cursor:pointer}
.w-actions span:hover{color:var(--accent)}
.w-stat{font-size:40px;font-weight:800;font-family:'Fraunces',serif;line-height:1.1}
.w-stat.red{color:var(--red)} .w-stat.accent{color:var(--accent)}
.w-stat-l{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-legend{flex:1;min-width:0}
.dl-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.dl-dot{width:9px;height:9px;border-radius:50%;flex:none}
.dl-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.type-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.type-pick .tp{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.type-pick .tp b{font-size:12.5px}
.type-pick .tp span{font-size:10.5px;color:var(--ink3);line-height:1.3}
.type-pick .tp.sel{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:760px){.type-pick{grid-template-columns:repeat(2,1fr)}}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#22242F;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .18s ease;max-width:340px}
.toast.err{background:var(--red)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,16,26,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease;margin-bottom:5vh}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px;font-weight:700;flex:1}
.modal-head .x{font-size:18px;color:var(--ink3);padding:4px 8px;border-radius:6px}
.modal-head .x:hover{background:var(--gray-soft);color:var(--ink)}
.modal-body{padding:6px 20px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}

/* login */
#login-screen{position:fixed;inset:0;background:radial-gradient(1200px 700px at 18% -10%,#14403A 0%,#101114 58%);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:18px;padding:38px 36px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.login-card .logo-mark{width:44px;height:44px;font-size:19px;margin-bottom:16px}
.login-card h1{font-size:21px;margin-bottom:4px}
.login-card p{color:var(--ink2);font-size:13.5px;margin-bottom:10px}
.login-err{background:var(--red-soft);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-top:14px;display:none}

/* home */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.stat .n.red{color:var(--red)} .stat .n.amber{color:var(--amber)} .stat .n.green{color:var(--green)} .stat .n.accent{color:var(--accent-ink)}
.section-title{font-size:14.5px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--gray-soft);color:var(--ink2);font-size:11.5px;padding:1px 8px;border-radius:10px}

/* kanban */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;min-height:calc(100vh - 210px)}
.col{background:#EFEEE9;border-radius:14px;min-width:272px;width:272px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:13px}
.col-head .dot{width:8px;height:8px;border-radius:50%}
.col-head .count{margin-left:auto;color:var(--ink3);font-size:12px;font-weight:600}
.col-body{padding:4px 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-body.dragover{background:rgba(91,91,214,.07);border-radius:10px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(20,22,40,.06)}
.tcard:hover{border-color:#C9C7BE;box-shadow:0 3px 10px rgba(22,24,29,.07)}
.tcard.dragging{opacity:.4}
.tcard .t{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:8px}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tcard .due{font-size:11.5px;color:var(--ink2);font-weight:600}
.tcard .due.over{color:var(--red)}
.add-card{margin:0 8px 10px;padding:7px;border-radius:8px;color:var(--ink2);font-weight:600;font-size:12.5px;text-align:left}
.add-card:hover{background:#E6E5DF;color:var(--ink)}

/* dashboard charts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid-2{grid-template-columns:1fr}}
.chart-card{padding:18px 20px}
.chart-card h3{font-size:14px;font-weight:800;margin-bottom:14px}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.hbar-label{width:150px;min-width:150px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.hbar-track{flex:1;background:var(--gray-soft);border-radius:6px;height:20px;position:relative}
.hbar-fill{height:100%;border-radius:6px;min-width:2px;transition:width .4s ease}
.hbar-val{font-weight:700;width:30px}

.sla-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}

/* request type picker */
.rt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rt-pick{border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;background:#fff;text-align:left}
.rt-pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.rt-pick .ic{font-size:20px}
.rt-pick b{display:block;font-size:13.5px;margin-bottom:2px}
.rt-pick span{font-size:12px;color:var(--ink2);line-height:1.35}

/* comments */
.comment{display:flex;gap:10px;margin-bottom:12px}
.comment .body{flex:1;background:var(--gray-soft);border-radius:0 10px 10px 10px;padding:9px 12px;font-size:13.5px}
.comment .body b{font-size:12.5px}
.comment .body .when{color:var(--ink3);font-size:11px;font-weight:500;margin-left:6px}
.comment .body p{margin-top:3px;white-space:pre-wrap}

/* checklist */
.chk{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:13.5px}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;color:var(--ink3)}
.chk .del{margin-left:auto;color:var(--ink3);font-size:14px;visibility:hidden}
.chk:hover .del{visibility:visible}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:700px){.field-grid{grid-template-columns:1fr}#sidebar{display:none}}
.kv{margin-bottom:8px;font-size:13.5px}
.kv b{color:var(--ink2);font-weight:600;font-size:12px;display:block;text-transform:uppercase;letter-spacing:.4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="logo-mark">C</div>
    <h1 id="li-title">WorkOS</h1>
    <p id="li-sub">Sign in to your workspace</p>
    <div id="su-fields" class="hidden">
      <label>Company name</label>
      <input id="su-company" placeholder="Your company">
      <label>Your name</label>
      <input id="su-name" placeholder="Full name">
    </div>
    <label>Email</label>
    <input id="li-email" type="email" placeholder="you@company.com" autocomplete="username">
    <label>Password</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <div class="login-err" id="li-err"></div>
    <button class="btn btn-primary" id="li-btn" style="width:100%;justify-content:center;margin-top:18px;padding:11px">Sign in</button>
    <p style="margin-top:16px;font-size:12.5px;color:var(--ink3);text-align:center">
      <span id="li-toggle-wrap">New company? <a href="#" id="li-toggle">Start a free 14-day trial</a></span>
    </p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="logo"><div class="logo-mark">W</div><div><b>WorkOS</b><span id="logo-co">Operations</span></div></div>
    <div id="nav-main"></div>
    <div class="nav-section" id="ws-section-title" style="display:flex;align-items:center;justify-content:space-between">Workspaces</div>
    <div id="nav-ws"></div>
    <div id="sidebar-user"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="crumb" id="crumb">Home</div>
      <div class="topbar-right" id="topbar-actions"></div>
    </div>
    <div id="ten-banner" class="hidden" style="padding:8px 24px;font-size:12.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--line)"></div>
    <div id="content"></div>
  </div>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://sknspnorwpoayymvndaz.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbnNwbm9yd3BvYXl5bXZuZGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjgwODcsImV4cCI6MjEwMzE0NDA4N30.73Q4zYazekw5U9r2od_h7zYcoJOVACAEFKep-qdnJ1I";
const ADMIN_API = SUPABASE_URL + "/functions/v1/admin-api";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const STATUSES = [
  {k:'todo', label:'To Do', color:'#8E93A8'},
  {k:'in_progress', label:'In Progress', color:'#2273C9'},
  {k:'review', label:'Review', color:'#B97A08'},
  {k:'blocked', label:'Blocked', color:'#D6455B'},
  {k:'done', label:'Done', color:'#12915E'},
];
const PRIORITIES = [
  {k:'urgent', label:'Urgent', color:'var(--red)', soft:'var(--red-soft)'},
  {k:'high', label:'High', color:'var(--amber)', soft:'var(--amber-soft)'},
  {k:'normal', label:'Normal', color:'var(--blue)', soft:'var(--blue-soft)'},
  {k:'low', label:'Low', color:'var(--ink3)', soft:'var(--gray-soft)'},
];
const REQ_STATUSES = [
  {k:'submitted', label:'Submitted', color:'var(--blue)', soft:'var(--blue-soft)'},
  {k:'in_review', label:'In Review', color:'var(--amber)', soft:'var(--amber-soft)'},
  {k:'approved', label:'Approved', color:'var(--green)', soft:'var(--green-soft)'},
  {k:'rejected', label:'Rejected', color:'var(--red)', soft:'var(--red-soft)'},
  {k:'in_progress', label:'In Progress', color:'var(--purple)', soft:'var(--purple-soft)'},
  {k:'done', label:'Done', color:'var(--green)', soft:'var(--green-soft)'},
  {k:'cancelled', label:'Cancelled', color:'var(--ink3)', soft:'var(--gray-soft)'},
];

/* ================= STATE ================= */
const S = {
  session:null, me:null,
  profiles:[], workspaces:[], projects:[], requestTypes:[],
  route:{view:'home'},
};
const isStaff = ()=> S.me && ['admin','internal','management'].includes(S.me.role);
const isAdmin = ()=> S.me && S.me.role==='admin';
const isMgmt  = ()=> S.me && S.me.role==='management';
const isExternal = ()=> S.me && ['partner','freelancer'].includes(S.me.role);
/* requester = read-only + can raise tickets/tasks and comment */
const isRequester = ()=> S.me && S.me.role==='requester';
const canEdit = ()=> isStaff() && !isRequester();
const canCreate = ()=> isStaff() || isRequester();

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc = s=> (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, err=false){
  const t=el(`<div class="toast ${err?'err':''}">${esc(msg)}</div>`);
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 3800);
}
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function avatar(p, sm=false){
  if(!p) return `<span class="avatar ${sm?'sm':''}" style="background:#C6C9D8" title="Unassigned">–</span>`;
  return `<span class="avatar ${sm?'sm':''}" style="background:${p.avatar_color}" title="${esc(p.full_name)}">${initials(p.full_name)}</span>`;
}
const prof = id => S.profiles.find(p=>p.id===id);
const wsById = id => S.workspaces.find(w=>w.id===id);
const projById = id => S.projects.find(p=>p.id===id);
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + (dt.getFullYear()!==new Date().getFullYear()? ' '+dt.getFullYear():''); }
function fmtDateTime(d){ if(!d) return ''; return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function daysDiff(d){ const a=new Date(d); a.setHours(0,0,0,0); const b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/86400000); }
function dueBadge(d, doneAlready){
  if(!d) return '';
  const n = daysDiff(d);
  const over = n<0 && !doneAlready;
  const txt = n===0 ? 'Today' : n===1 ? 'Tomorrow' : n===-1 ? 'Yesterday' : fmtDate(d);
  return `<span class="due ${over?'over':''}">${txt}</span>`;
}
function slaBadge(sla, status){
  if(!sla) return '';
  if(['done','approved','rejected','cancelled'].includes(status)) return '';
  const ms = new Date(sla) - Date.now();
  const h = Math.round(ms/3600000);
  if(ms<0) return `<span class="sla-pill" style="background:var(--red-soft);color:var(--red)">SLA breached ${Math.abs(h)}h ago</span>`;
  if(h<=8) return `<span class="sla-pill" style="background:var(--amber-soft);color:var(--amber)">SLA in ${h}h</span>`;
  return `<span class="sla-pill" style="background:var(--gray-soft);color:var(--ink2)">SLA ${fmtDateTime(sla)}</span>`;
}
function statusChip(k){
  const s = STATUSES.find(x=>x.k===k)||STATUSES[0];
  return `<span class="chip" style="background:${s.color}1A;color:${s.color}"><span style="width:7px;height:7px;border-radius:50%;background:${s.color}"></span>${s.label}</span>`;
}
function prioChip(k){
  const p = PRIORITIES.find(x=>x.k===k)||PRIORITIES[2];
  return `<span class="chip" style="background:${p.soft};color:${p.color}">${p.label}</span>`;
}
function reqStatusChip(k){
  const s = REQ_STATUSES.find(x=>x.k===k)||REQ_STATUSES[0];
  return `<span class="chip" style="background:${s.soft};color:${s.color}">${s.label}</span>`;
}
function modal(html, wide=false){
  const back = el(`<div class="modal-back"><div class="modal ${wide?'wide':''}">${html}</div></div>`);
  back.addEventListener('mousedown', e=>{ if(e.target===back) back.remove(); });
  $('#modal-root').appendChild(back);
  return back;
}
function closeModals(){ $('#modal-root').innerHTML=''; }
/* Generic little popover menu, anchored to an element. items:[{label,danger,fn}|'-'] */
let _ctxItems = [];
function ctxMenu(anchor, items){
  document.getElementById('tvmenu')?.remove();
  document.querySelectorAll('.ws-menu.on').forEach(x=>x.classList.remove('on'));
  _ctxItems = items.filter(i=>i!=='-');
  const m = document.createElement('div'); m.id='tvmenu';
  m.innerHTML = `<div class="opts">${items.map(i=> i==='-'
    ? '<div style="height:1px;background:var(--line);margin:5px 6px"></div>'
    : `<div class="opt" ${i.danger?'style="color:var(--red)"':''} data-i="${_ctxItems.indexOf(i)}">${esc(i.label)}</div>`).join('')}</div>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mb = m.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - mb.width - 10) + 'px';
  m.style.top  = (r.bottom + mb.height > innerHeight ? Math.max(8, r.top - mb.height - 4) : r.bottom + 4) + 'px';
  anchor.classList.add('on');
  m.querySelectorAll('.opt').forEach(o=> o.onclick = e=>{
    e.stopPropagation();
    const fn = _ctxItems[+o.dataset.i]?.fn;
    m.remove(); anchor.classList.remove('on');
    if(fn) fn();
  });
  const off = e=>{ if(!m.contains(e.target)){ m.remove(); anchor.classList.remove('on'); document.removeEventListener('mousedown', off); } };
  setTimeout(()=>document.addEventListener('mousedown', off), 0);
}
async function logActivity(entity_type, entity_id, action, detail={}){
  try{ await db.from('activity_log').insert({actor_id:S.me.id, entity_type, entity_id, action, detail}); }catch(e){}
}

/* ================= AUTH ================= */
let signupMode = false;
function setAuthMode(su){
  signupMode = su;
  $('#su-fields').classList.toggle('hidden', !su);
  $('#li-title').textContent = su? 'Start your trial' : 'WorkOS';
  $('#li-sub').textContent = su? '14 days free · no card required' : 'Sign in to your workspace';
  $('#li-btn').textContent = su? 'Create company' : 'Sign in';
  $('#li-toggle-wrap').innerHTML = su? 'Already have an account? <a href="#" id="li-toggle">Sign in</a>'
                                     : 'New company? <a href="#" id="li-toggle">Start a free 14-day trial</a>';
  $('#li-toggle').addEventListener('click', e=>{ e.preventDefault(); setAuthMode(!signupMode); });
}
async function signIn(){
  const email=$('#li-email').value.trim(), pass=$('#li-pass').value;
  const errBox=$('#li-err'); errBox.style.display='none';
  if(!email||!pass) return;
  const btn=$('#li-btn'); btn.disabled=true;
  try{
    if(signupMode){
      const company_name=$('#su-company').value.trim(), full_name=$('#su-name').value.trim();
      if(!company_name||!full_name) throw new Error('Company name and your name are required');
      if(pass.length<8) throw new Error('Password must be at least 8 characters');
      btn.textContent='Creating your workspace…';
      const res = await fetch(ADMIN_API+'/signup', {method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
        body:JSON.stringify({company_name, full_name, email, password:pass})});
      const out = await res.json();
      if(!res.ok) throw new Error(out.error||'Signup failed');
    }
    btn.textContent='Signing in…';
    const {error} = await db.auth.signInWithPassword({email, password:pass});
    if(error) throw new Error(error.message==='Invalid login credentials' ? 'Wrong email or password.' : error.message);
  }catch(e){ errBox.textContent=e.message; errBox.style.display='block'; }
  btn.disabled=false; btn.textContent = signupMode? 'Create company':'Sign in';
}
$('#li-toggle').addEventListener('click', e=>{ e.preventDefault(); setAuthMode(!signupMode); });
$('#li-btn').addEventListener('click', signIn);
$('#li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
$('#li-email').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });

db.auth.onAuthStateChange(async (event, session)=>{
  S.session = session;
  if(session && !S.me){ await boot(); }
  if(!session){ S.me=null; $('#app').classList.add('hidden'); $('#login-screen').classList.remove('hidden'); }
});

let _booting=false;
async function boot(){
  if(_booting || S.me) return; _booting=true;
  try{ await _boot(); } finally{ _booting=false; }
}
async function _boot(){
  const {data:me, error} = await db.from('profiles').select('*').eq('id', S.session.user.id).single();
  if(error || !me){ toast('Could not load your profile', true); return; }
  if(!me.active || !me.company_id){ await db.auth.signOut(); toast('Your account is awaiting activation by an admin.', true); return; }
  S.me = me;
  await refreshCore();
  if(S.company && ['suspended','cancelled'].includes(S.company.status) && !me.platform_admin){
    await db.auth.signOut();
    toast('This company subscription is inactive. Contact support to reactivate.', true);
    return;
  }
  $('#login-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  const b = $('#ten-banner');
  if(S.company && S.company.status==='trial' && S.company.trial_ends_at){
    const left = Math.max(0, Math.ceil((new Date(S.company.trial_ends_at)-Date.now())/86400000));
    b.textContent = 'Free trial — ' + left + ' day' + (left===1?'':'s') + ' left';
    b.classList.remove('hidden');
  } else if(S.company && S.company.status==='past_due'){
    b.textContent = 'Payment past due — please settle the subscription to avoid interruption';
    b.classList.remove('hidden');
  } else b.classList.add('hidden');
  renderSidebar();
  navigate(location.hash || '#/home');
}
async function refreshCore(){
  const [pr, ws, pj, rt, br, co] = await Promise.all([
    db.from('profiles').select('*').order('full_name'),
    db.from('workspaces').select('*').order('position'),
    db.from('projects').select('*').order('created_at'),
    db.from('request_types').select('*').eq('active', true).order('position'),
    db.from('brands').select('*').order('name'),
    db.from('companies').select('*').order('created_at'),
  ]);
  S.profiles = pr.data||[]; S.workspaces = ws.data||[]; S.projects = pj.data||[]; S.requestTypes = rt.data||[];
  S.brandsList = br.data||[];
  S.allCompanies = co.data||[];
  S.company = S.allCompanies.find(c=>c.id===S.me?.company_id) || null;
}
async function uploadAttachments(entity_type, entity_id, fileInput){
  const files = fileInput && fileInput.files ? [...fileInput.files] : [];
  let ok = 0;
  for(const f of files){
    const path = entity_type + '/' + entity_id + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
    const {error} = await db.storage.from('attachments').upload(path, f);
    if(error){ toast('Upload failed: ' + error.message, true); continue; }
    await db.from('attachments').insert({entity_type, entity_id, file_name:f.name, storage_path:path, size_bytes:f.size, uploaded_by:S.me.id});
    ok++;
  }
  return ok;
}
function attLink(a){
  const {data} = db.storage.from('attachments').getPublicUrl(a.storage_path);
  return `<a href="${data.publicUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:12.5px;text-decoration:underline;text-underline-offset:3px">${esc(a.file_name)}</a>`;
}

/* ================= ROUTER ================= */
window.addEventListener('hashchange', ()=>{ if(S.me) navigate(location.hash); });
function navigate(hash){
  if(location.hash !== hash) { location.hash = hash; return; }
  closeModals();
  const parts = hash.replace(/^#\//,'').split('/');
  const view = parts[0]||'home';
  S.route = {view, id:parts[1]};
  renderSidebar();
  const C = $('#content'); C.scrollTop=0;
  const map = {home:renderHome, ws:renderWorkspace, project:renderProject, requests:renderRequests, approvals:renderApprovals, dashboard:renderDashboard, admin:renderAdmin, platform:renderPlatform};
  (map[view]||renderHome)(parts[1]);
}

/* ================= SIDEBAR ================= */
function renderSidebar(){
  const v = S.route.view, id=S.route.id;
  const items = [
    {h:'#/home', label:'My Work', show:true},
    {h:'#/requests', label:'Requests', show:true},
    {h:'#/approvals', label:'Approvals', show:true, badge:'appr'},
    {h:'#/dashboard', label:'Dashboard', show:isStaff()||isRequester()},
    {h:'#/admin', label:'Admin', show:isAdmin()},
    {h:'#/platform', label:'Platform', show:!!(S.me&&S.me.platform_admin)},
  ];
  $('#nav-main').innerHTML = '<div class="nav-section">Menu</div>' + items.filter(i=>i.show).map(i=>
    `<div class="nav-item ${('#/'+v)===i.h?'active':''}" onclick="location.hash='${i.h}'">${i.label}<span class="count hidden" id="badge-${i.badge||''}"></span></div>`).join('');
  updateApprovalBadge();

  // teams: RLS already scopes what each user can see (internal = their teams only)
  let wss = S.workspaces;
  if(isExternal()){
    const myWs = new Set(S.projects.map(p=>p.workspace_id));
    wss = wss.filter(w=>myWs.has(w.id));
  }
  const tt = $('#ws-section-title');
  tt.style.display = (wss.length || isStaff())? 'flex' : 'none';
  tt.innerHTML = 'Workspaces' + (isAdmin()? '<button onclick="newWorkspaceModal()" title="New workspace" style="color:var(--ink3);font-size:15px;line-height:1;padding:0 2px;border-radius:5px">+</button>':'');
  $('#nav-ws').innerHTML = wss.map(w=>
    `<div class="ws-item ${v==='ws'&&id===w.id?'active':''}" onclick="location.hash='#/ws/${w.id}'">
      <span class="ws-dot" style="background:${w.color}"></span><span class="ws-name">${esc(w.name)}</span>
      ${canEdit()? `<span class="ws-menu" title="Workspace options" onclick="event.stopPropagation();wsMenu(this,'${w.id}')">⋯</span>`:''}
    </div>`).join('') || (isAdmin()? '<div style="padding:4px 22px;font-size:12px;color:var(--ink3)">No workspaces yet — press +</div>':'');

  const lc = $('#logo-co'); if(lc && S.company) lc.textContent = S.company.name;
  const icoKey = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>';

/* ================= PUBLIC FORM (no login) ================= */
function pfTitleLabel(def){ return def.title_label || (/creative|campaign|artwork/i.test(def.name||'')? 'Campaign Name' : 'Subject'); }
async function renderPublicForm(token){
  $('#login-screen').classList.add('hidden');
  $('#app').classList.add('hidden');
  const mount = el('<div style="position:fixed;inset:0;overflow-y:auto;background:radial-gradient(1200px 700px at 18% -10%,#14403A 0%,#101114 58%);padding:5vh 16px;z-index:150"><div id="pf-card" style="max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:34px 34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)"><div style="color:#9DA1A7">Loading form…</div></div></div>');
  document.body.appendChild(mount);
  const card = mount.querySelector('#pf-card');
  try{
    const res = await fetch(ADMIN_API + '/form-def?token=' + encodeURIComponent(token), {headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}});
    const def = await res.json();
    if(!res.ok) throw new Error(def.error||'Form not found');
    S.brandsList = (def.brands||[]).map(n=>({name:n, active:true}));
    card.innerHTML = `
      <div style="font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)">${esc(def.company)}</div>
      <h1 style="font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;margin:6px 0 4px">${esc(def.name)}</h1>
      <p style="color:var(--ink2);font-size:13.5px">${esc(def.description||'')}</p>
      <label>Your name <span class="req">*</span></label><input id="pf-name">
      <label>Your email <span class="req">*</span></label><input id="pf-email" type="email">
      <label>${esc(pfTitleLabel(def))}${pfTitleLabel(def)!=='Subject'?' <span class="req">*</span>':''}</label><input id="pf-title" placeholder="${esc(def.title_hint||(pfTitleLabel(def)!=='Subject'?'BRAND x PLATFORM - CAMPAIGN NAME - PERIOD':'Short summary (optional)'))}">
      ${(def.fields||[]).map(fieldInput).join('')}
      <button class="btn btn-primary" id="pf-send" style="width:100%;justify-content:center;margin-top:22px;padding:12px">Submit request</button>
      <p style="margin-top:14px;font-size:11.5px;color:var(--ink3);text-align:center">Response SLA: ${def.sla_hours} hours · Powered by WorkOS</p>`;
    card.querySelector('#pf-send').onclick = async ()=>{
      const guest_name=card.querySelector('#pf-name').value.trim(), guest_email=card.querySelector('#pf-email').value.trim();
      if(!guest_name||!guest_email) return toast('Please fill your name and email', true);
      const tl = pfTitleLabel(def);
      if(tl!=='Subject' && !card.querySelector('#pf-title').value.trim()) return toast('"'+tl+'" is required', true);
      const values={};
      for(const f of (def.fields||[])){
        const v = readField(card, f);
        if(f.required && !v) return toast('"'+f.label+'" is required', true);
        values[f.key]=v;
      }
      const btn=card.querySelector('#pf-send'); btn.disabled=true; btn.textContent='Submitting…';
      try{
        const r2 = await fetch(ADMIN_API+'/public-submit', {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}, body:JSON.stringify({token, guest_name, guest_email, title:card.querySelector('#pf-title').value, values})});
        const out = await r2.json();
        if(!r2.ok) throw new Error(out.error||'Failed');
        card.innerHTML = '<div style="text-align:center;padding:30px 0"><div style="font-family:\'Fraunces\',Georgia,serif;font-size:26px;font-weight:600">Request received</div><p style="color:var(--ink2);margin-top:12px;line-height:1.6">Your ticket number is <b>WO-'+out.ticket_no+'</b>.<br>The team will get back to you within '+def.sla_hours+' hours.</p></div>';
      }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Submit request'; }
    };
  }catch(e){ card.innerHTML = '<div style="text-align:center;color:var(--ink2);padding:20px 0">'+esc(e.message)+'</div>'; }
}

<script>
/* ================= HOME (My Work) ================= */
async function renderHome(){
  setTopbar('My Work');
  const C=$('#content');
  C.innerHTML = '<div class="empty">Loading…</div>';
  const [tks, reqs, apprs] = await Promise.all([
    db.from('tasks').select('*').eq('assignee_id',S.me.id).neq('status','done').order('due_date',{ascending:true,nullsFirst:false}),
    db.from('requests').select('*').eq('submitted_by',S.me.id).not('status','in',"(done,cancelled)").order('created_at',{ascending:false}),
    db.from('approvals').select('*').eq('approver_id',S.me.id).eq('status','pending'),
  ]);
  const tasks = tks.data||[], requests = reqs.data||[], approvals = apprs.data||[];
  const overdue = tasks.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const today = tasks.filter(t=>t.due_date && daysDiff(t.due_date)===0);

  const hello = new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening';
  C.innerHTML = `
    <div class="page-head"><div><h1>${hello}, ${esc(S.me.full_name.split(' ')[0])}</h1>
      <div class="sub">${new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</div></div>
      <div class="actions"><button class="btn btn-primary" onclick="newRequestFlow()">＋ New request</button></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n ${overdue.length?'red':''}">${overdue.length}</div><div class="l">Overdue tasks</div></div>
      <div class="stat"><div class="n amber">${today.length}</div><div class="l">Due today</div></div>
      <div class="stat"><div class="n accent">${tasks.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n">${requests.length}</div><div class="l">My open requests</div></div>
      <div class="stat"><div class="n ${approvals.length?'red':''}">${approvals.length}</div><div class="l">Waiting for my approval</div></div>
    </div>
    <div class="section-title">My tasks <span class="count">${tasks.length}</span></div>
    <div class="card">${tasks.length? taskTable(tasks) : `<div class="empty">No open tasks assigned to you</div>`}</div>
    <div class="section-title">My requests <span class="count">${requests.length}</span></div>
    <div class="card">${requests.length? requestTable(requests) : `<div class="empty">No open requests yet</div>`}</div>
    ${approvals.length? `<div class="section-title">Waiting for my approval <span class="count">${approvals.length}</span></div>
      <div class="card">${approvalTable(approvals)}</div>`:''}
  `;
}
function taskTable(tasks){
  return `<table class="tbl"><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Priority</th><th>Due</th><th>Assignee</th></tr></thead><tbody>
    ${tasks.map(t=>{
      const p=projById(t.project_id);
      return `<tr class="rowlink" onclick="openTask('${t.id}')">
        <td style="font-weight:600">${esc(t.title)}</td>
        <td style="color:var(--ink2)">${esc(p?p.name:'—')}</td>
        <td>${statusChip(t.status)}</td><td>${prioChip(t.priority)}</td>
        <td>${dueBadge(t.due_date, t.status==='done')||'<span style="color:var(--ink3)">—</span>'}</td>
        <td>${avatar(prof(t.assignee_id), true)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function requestTable(reqs){
  return `<table class="tbl"><thead><tr><th>Request</th><th>Type</th><th>Status</th><th>SLA</th><th>Submitted by</th><th>Assigned</th></tr></thead><tbody>
    ${reqs.map(r=>{
      const rt=S.requestTypes.find(x=>x.id===r.request_type_id);
      return `<tr class="rowlink" onclick="openRequest('${r.id}')">
        <td style="font-weight:600">${r.ticket_no? `<span style="color:var(--ink3);font-weight:700;font-size:11.5px;margin-right:6px">WO-${r.ticket_no}</span>`:''}${esc(r.title)}</td>
        <td style="color:var(--ink2)">${rt? esc(rt.name):'—'}</td>
        <td>${reqStatusChip(r.status)}</td>
        <td>${slaBadge(r.sla_due_at, r.status)}</td>
        <td>${avatar(prof(r.submitted_by), true)}</td>
        <td>${avatar(prof(r.assigned_to), true)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function approvalTable(apprs){
  return `<table class="tbl"><thead><tr><th>Approval</th><th>Requested by</th><th>Created</th><th></th></tr></thead><tbody>
    ${apprs.map(a=>`<tr>
      <td style="font-weight:600">${esc(a.title||'Approval')}</td>
      <td>${avatar(prof(a.requested_by), true)} <span style="color:var(--ink2)">${esc(prof(a.requested_by)?.full_name||'')}</span></td>
      <td style="color:var(--ink2)">${fmtDateTime(a.created_at)}</td>
      <td style="text-align:right;white-space:nowrap">
        ${a.request_id? `<button class="btn btn-ghost btn-sm" onclick="openRequest('${a.request_id}')">View</button>`:''}
        <button class="btn btn-green btn-sm" onclick="decideApproval('${a.id}','approved')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="decideApproval('${a.id}','rejected')">Reject</button></td>
    </tr>`).join('')}</tbody></table>`;
}

/* ================= WORKSPACE ================= */
async function renderWorkspace(id){
  const w = wsById(id); if(!w){ location.hash='#/home'; return; }
  setTopbar(esc(w.name), (canEdit()? `<button class="btn btn-ghost btn-sm" onclick="editWorkspaceModal('${w.id}')">Edit workspace</button>`:'')
    + (isStaff()? `<button class="btn btn-ghost btn-sm" onclick="teamMembersModal('${w.id}')">Members</button>
    <button class="btn btn-primary btn-sm" onclick="newProjectModal('${w.id}')">＋ New project</button>`:''));
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const projects = S.projects.filter(p=>p.workspace_id===id && p.status!=='archived');
  const ids = projects.map(p=>p.id);
  let counts = {};
  if(ids.length){
    const {data} = await db.from('tasks').select('project_id,status').in('project_id', ids);
    (data||[]).forEach(t=>{ counts[t.project_id]=counts[t.project_id]||{open:0,done:0}; t.status==='done'?counts[t.project_id].done++:counts[t.project_id].open++; });
  }
  C.innerHTML = `
    <div class="page-head"><div><h1>${esc(w.name)}</h1><div class="sub">${esc(w.description)}</div></div></div>
    ${projects.length? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
      ${projects.map(p=>{
        const c = counts[p.id]||{open:0,done:0}; const total=c.open+c.done;
        const pct = total? Math.round(c.done/total*100):0;
        return `<div class="card" style="padding:16px;cursor:pointer" onclick="location.hash='#/project/${p.id}'">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
            <span class="ws-dot" style="background:${p.color};width:11px;height:11px"></span>
            <b style="font-size:14.5px;flex:1">${esc(p.name)}</b>
            ${p.status!=='active'? `<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${p.status.replace('_',' ')}</span>`:''}
          </div>
          <div style="color:var(--ink2);font-size:12.5px;min-height:18px;margin-bottom:12px">${esc(p.description||'')}</div>
          <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)">
            <div style="flex:1;height:6px;background:var(--gray-soft);border-radius:4px"><div style="width:${pct}%;height:100%;border-radius:4px;background:${p.color}"></div></div>
            <span style="font-weight:700">${pct}%</span><span>${c.open} open</span>
            ${p.due_date? dueBadge(p.due_date,false):''}
          </div></div>`;
      }).join('')}</div>`
    : `<div class="card empty">No projects yet in this workspace${isStaff()? ' — create the first one.':''}</div>`}`;
}
async function teamMembersModal(wsId){
  const {data:members} = await db.from('workspace_members').select('*').eq('workspace_id',wsId);
  const memberIds = new Set((members||[]).map(m=>m.user_id));
  const internals = S.profiles.filter(p=>p.active && p.role==='internal');
  const m = modal(`<div class="modal-head"><h2>Workspace members</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <p style="color:var(--ink2);font-size:13px;margin-top:8px">Internal staff only see the workspaces they belong to. Admin and Management see every workspace. Partners get access per-project via project members.</p>
      ${internals.length? internals.map(p=>`
        <div class="chk"><input type="checkbox" data-uid="${p.id}" ${memberIds.has(p.id)?'checked':''}>
        ${avatar(p,true)} <span>${esc(p.full_name)} <span style="color:var(--ink3)">· ${esc(p.email)}</span></span></div>`).join('')
      : '<div class="empty">No internal staff accounts yet. Create them in Admin → Users.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="tm-save">Save</button></div>`);
  m.querySelector('#tm-save').onclick = async ()=>{
    const want = new Set([...m.querySelectorAll('input[data-uid]:checked')].map(i=>i.dataset.uid));
    const add=[...want].filter(u=>!memberIds.has(u)).map(user_id=>({workspace_id:wsId,user_id}));
    const rm=[...memberIds].filter(u=>!want.has(u) && internals.some(p=>p.id===u));
    if(add.length){ const {error} = await db.from('workspace_members').insert(add); if(error) return toast(error.message, true); }
    if(rm.length){ const {error} = await db.from('workspace_members').delete().eq('workspace_id',wsId).in('user_id',rm); if(error) return toast(error.message, true); }
    closeModals(); toast('Workspace members updated');
  };
}
function newProjectModal(wsId){

      <label>Project name <span class="req">*</span></label><input id="pj-name" placeholder="e.g. 9.9 Mega Sale — Brand X">
      <label>Description</label><textarea id="pj-desc" rows="2"></textarea>
      <div class="field-grid">
        <div><label>Workspace</label><select id="pj-ws">${S.workspaces.map(w=>`<option value="${w.id}" ${w.id===wsId?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
        <div><label>Due date</label><input id="pj-due" type="date"></div>

/* ================= PROJECT (Board / List) ================= */
let boardMode = 'board';
async function renderProject(id){
  const p = projById(id);
  if(!p){ // maybe not in cache (partner) — try fetch
    const {data} = await db.from('projects').select('*').eq('id',id).single();
    if(!data){ location.hash='#/home'; return; }
    S.projects.push(data); return renderProject(id);
  }
  const w = wsById(p.workspace_id);
  setTopbar(`<span onclick="location.hash='#/ws/${p.workspace_id}'" style="cursor:pointer">${w? esc(w.name):''}</span> <span>/</span> ${esc(p.name)}`,
    `<div class="tabs"><button class="tab ${boardMode==='board'?'active':''}" onclick="boardMode='board';renderProject('${id}')">Board</button>
     <button class="tab ${boardMode==='list'?'active':''}" onclick="boardMode='list';renderProject('${id}')">List</button>
     <button class="tab ${boardMode==='table'?'active':''}" onclick="boardMode='table';renderProject('${id}')">Table</button></div>
     ${isStaff()? `<button class="btn btn-ghost btn-sm" onclick="projectMembersModal('${id}')">Partner access</button>`:''}
     <button class="btn btn-primary btn-sm" onclick="newTaskModal('${id}')">＋ New task</button>`);
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const [{data:tasks, error},{data:sc},{data:fields},{data:groups}] = await Promise.all([
    db.from('tasks').select('*').eq('project_id',id).order('position'),
    db.from('subtasks').select('task_id,status,tasks!inner(project_id)').eq('tasks.project_id', id),
    db.from('project_fields').select('*').eq('project_id',id).order('position').order('created_at'),
    db.from('project_groups').select('*').eq('project_id',id).order('position').order('created_at'),
  ]);
  if(error){ C.innerHTML=`<div class="card empty">${esc(error.message)}</div>`; return; }
  S._tasksAll = tasks||[];
  S._tasks = tvShowArch ? S._tasksAll : S._tasksAll.filter(t=>!t.archived_at);
  S._fields = fields||[]; S._groups = groups||[];
  S._subs = {};
  (sc||[]).forEach(s=>{ const o=S._subs[s.task_id]||(S._subs[s.task_id]={done:0,total:0}); o.total++; if(s.status==='done') o.done++; });
  if(boardMode==='table'){
    renderProjectTableView(id);
    return;
  }
  if(boardMode==='list'){
    const sorted=[...S._tasks].sort((a,b)=> (a.status==='done')-(b.status==='done') || (a.due_date||'9999').localeCompare(b.due_date||'9999'));
    C.innerHTML = `<div class="card">${sorted.length? taskTable(sorted): `<div class="empty">No tasks yet</div>`}</div>`;
    return;
  }
  C.innerHTML = `<div class="board">${STATUSES.map(s=>{
    const list = S._tasks.filter(t=>t.status===s.k);
    return `<div class="col" data-status="${s.k}">
      <div class="col-head"><span class="dot" style="background:${s.color}"></span>${s.label}<span class="count">${list.length}</span></div>
      <div class="col-body" data-status="${s.k}">${list.map(taskCard).join('')}</div>
      <button class="add-card" onclick="newTaskModal('${id}','${s.k}')">＋ Add task</button>
    </div>`;}).join('')}</div>`;
  wireDnD(id);
}
function taskCard(t){
  const done = t.status==='done';
  const chk = t._chk;
  return `<div class="tcard" draggable="true" data-id="${t.id}" onclick="openTask('${t.id}')">
    <div class="t">${esc(t.title)}</div>
    <div class="meta">${prioChip(t.priority)}${dueBadge(t.due_date, done)}
      ${(S._subs||{})[t.id]?.total? `<span class="subchip" style="font-size:11px;font-weight:700;color:var(--ink3);background:var(--gray-soft);border-radius:6px;padding:1px 6px">${S._subs[t.id].done}/${S._subs[t.id].total}</span>`:''}
      ${t.tags?.length? t.tags.slice(0,2).map(g=>`<span class="chip" style="background:var(--purple-soft);color:var(--purple)">${esc(g)}</span>`).join(''):''}
      <span style="margin-left:auto">${avatar(prof(t.assignee_id), true)}</span></div></div>`;
}
function wireDnD(projectId){
  let dragId=null;
  document.querySelectorAll('.tcard').forEach(c=>{
    c.addEventListener('dragstart', e=>{ dragId=c.dataset.id; c.classList.add('dragging'); });
    c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const status = col.dataset.status; if(!dragId) return;
      const t = S._tasks.find(x=>x.id===dragId); if(!t || t.status===status) return;
      const old = t.status; t.status=status;
      renderProjectFromCache(projectId);
      const {error} = await db.from('tasks').update({status}).eq('id',dragId);
      if(error){ t.status=old; renderProjectFromCache(projectId); toast(error.message, true); }
      else logActivity('task', dragId, 'status_changed', {from:old, to:status});
    });
  });
}

/* Option registries for click-to-edit dropdown cells (rendering a <select> with all
   options in every cell made large projects extremely slow — cells are now plain text
   until clicked). */
let TVO = {};
function tvBuildOpts(flds){
  TVO = {
    status: STATUSES.map(s=>({v:s.k, l:s.label})),
    priority: PRIORITIES.map(p=>({v:p.k, l:p.label})),
    people: tvPeople().map(p=>({v:p.id, l:p.full_name})),
    brand: (S.brandsList||[]).filter(b=>b.active!==false).map(b=>({v:b.name, l:b.name})),
  };
  (flds||[]).forEach(f=>{ if(f.ftype==='select') TVO['f_'+f.id]=(f.options||[]).map(o=>({v:o, l:o})); });
}
function tvFmtDate(v){
  if(!v) return '';
  const d = new Date(v+'T00:00:00'); if(isNaN(d)) return v;
  const s = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return d.getFullYear()===new Date().getFullYear()? s : s+' '+d.getFullYear();
}
function tvChip(label, color){
  return `<span class="tv-chip" style="background:${color}1C;color:${color}"><span class="cdot" style="background:${color}"></span>${esc(label)}</span>`;
}
function tvDisplay(kind, val, t){
  if(val===undefined||val===null||val===''){
    if(kind==='status'||kind==='priority') return `<span class="tv-fill tv-fill-empty">—</span>`;
    return `<span class="tv-empty">—</span>`;
  }
  if(kind==='status'){ const s=STATUSES.find(x=>x.k===val); return s? `<span class="tv-fill" style="background:${s.color}">${esc(s.label)}</span>` : esc(val); }
  if(kind==='priority'){ const p=PRIORITIES.find(x=>x.k===val); return p? `<span class="tv-fill" style="background:${p.color}">${esc(p.label)}</span>` : esc(val); }
  if(kind==='people'){ const p=prof(val); return p? `${avatar(p,true)}<span>${esc(p.full_name)}</span>` : `<span class="tv-empty">—</span>`; }
  if(kind==='due') return dueBadge(val, t?.status==='done') || esc(tvFmtDate(val));
  if(kind==='date') return esc(tvFmtDate(val));
  if(kind==='number') return `<span class="tv-num">${esc(val)}</span>`;
  if(kind==='text' && /^https?:\/\//.test(val)){
    let host=''; try{ host=new URL(val).hostname.replace('www.','').split('.')[0]; }catch(e){ host='link'; }
    return `<a class="tv-link" href="${esc(val)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ${esc(host)}</a>`;
  }
  if(kind==='brand'||kind.startsWith('f_')) return `<span class="tv-chip" style="background:var(--gray-soft);color:var(--ink)">${esc(val)}</span>`;
  return esc(val);
}
function tvPickHTML(kind, tid, field, isCustom, val, t){
  const fill = (kind==='status'||kind==='priority')? ' fillcell':'';
  if(!canEdit()) return `<div class="tv-pickv${fill} ro">${tvDisplay(kind, val, t)}</div>`;
  return `<div class="tv-pickv${fill}" data-kind="${kind}" data-tid="${tid}" data-field="${esc(field)}" data-cust="${isCustom?1:0}" onclick="tvEdit(this,event)">${tvDisplay(kind, val, t)}</div>`;
}
/* ---- dropdown picker (chip cells open a menu, like monday) ---- */
function tvCloseMenu(){ document.getElementById('tvmenu')?.remove(); document.removeEventListener('mousedown', tvMenuOutside); }
function tvMenuOutside(e){ if(!document.getElementById('tvmenu')?.contains(e.target)) tvCloseMenu(); }
function tvEdit(el, ev){
  const {kind, tid, field, cust} = el.dataset;
  const t = S._tasks.find(x=>x.id===tid); if(!t) return;
  const cur = cust==='1' ? (t.custom||{})[field] : t[field];
  const save = async (val)=>{
    if(cust!=='1' && (field==='status'||field==='priority') && (val===null||val==='')) return;
    if(cust==='1') await tvCustom(tid, field, val===null? '' : val);
    else await tvCore(tid, field, val);
    el.innerHTML = tvDisplay(kind, cust==='1'? (t.custom||{})[field] : t[field], t);
  };
  // inline editors for free-form types
  if(kind==='text'||kind==='number'||kind==='date'||kind==='due'){
    if(el.querySelector('input')) return;
    const inp=document.createElement('input');
    inp.type = kind==='number'?'number':(kind==='date'||kind==='due')?'date':'text';
    inp.value = cur??'';
    el.textContent=''; el.appendChild(inp); inp.focus();
    let cancelled=false;
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){ cancelled=true; inp.blur(); } };
    inp.onblur=async ()=>{
      if(cancelled){ el.innerHTML=tvDisplay(kind, cur, t); return; }
      const val=inp.value.trim();
      if(val===(cur??'')) { el.innerHTML=tvDisplay(kind, cur, t); return; }
      await save(val===''? null : val);
    };
    return;
  }
  // popover menu for choice types
  const opts = TVO[kind]||[];
  const renderOpt = o=>
    kind==='status'? `<span class="tv-fill mini" style="background:${STATUSES.find(s=>s.k===o.v)?.color||'#8E93A8'}">${esc(o.l)}</span>` :
    kind==='priority'? `<span class="tv-fill mini" style="background:${PRIORITIES.find(p=>p.k===o.v)?.color||'#8E93A8'}">${esc(o.l)}</span>` :
    kind==='people'? `${avatar(prof(o.v),true)}<span>${esc(o.l)}</span>` : esc(o.l);
  const canClear = !(cust!=='1' && (field==='status'||field==='priority'));
  tvShowMenu(el, opts, renderOpt, save, opts.length>8, canClear);
}
function tvShowMenu(anchor, opts, renderOpt, onPick, withSearch, includeClear){
  tvCloseMenu();
  const m = document.createElement('div'); m.id='tvmenu';
  m.innerHTML = `${withSearch? `<div class="search"><input placeholder="Search…"></div>`:''}<div class="opts">
    ${includeClear? `<div class="opt clear" data-v="">Clear</div>`:''}
    ${opts.map(o=>`<div class="opt" data-v="${esc(o.v)}">${renderOpt(o)}</div>`).join('')}
  </div>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.left, window.innerWidth-mw-12);
  let y = (r.bottom+mh+12 > window.innerHeight && r.top-mh-6 > 0)? r.top-mh-6 : r.bottom+4;
  m.style.left=Math.max(8,x)+'px'; m.style.top=Math.max(8,y)+'px';
  m.querySelectorAll('.opt').forEach(o=>o.onmousedown=async e=>{ e.preventDefault(); tvCloseMenu(); await onPick(o.dataset.v||null); });
  if(withSearch){
    const si=m.querySelector('.search input'); si.focus();
    si.oninput=()=>{ const q=si.value.toLowerCase(); m.querySelectorAll('.opt:not(.clear)').forEach(o=>{ o.style.display = o.textContent.toLowerCase().includes(q)?'flex':'none'; }); };
  }
  setTimeout(()=>document.addEventListener('mousedown', tvMenuOutside),0);
}
function tvCell(t, f){

  if(f.ftype==='number')   return tvPickHTML('number', t.id, f.id, true, v);
  if(f.ftype==='date')     return tvPickHTML('date', t.id, f.id, true, v);
  if(f.ftype==='select')   return tvPickHTML('f_'+f.id, t.id, f.id, true, v);
  if(f.ftype==='person')   return tvPickHTML('people', t.id, f.id, true, v);

const tvCollapsed = new Set();
let tvPid = null;
const tvSel = new Set();
function tvSelToggle(id, on){

  document.querySelector(`tr[data-tid="${id}"]`)?.classList.toggle('rowsel', on);

function tvSelGroup(el, gid){

    : gid==='' ? (S._tasks||[]).filter(t=>!t.group_id || !inGroups.has(t.group_id))

  const wrap = el.closest('.tv-wrap');

async function tvBulkApply(field, value){

function tvToggleArch(){ tvShowArch=!tvShowArch; tvApplyArch(); const y=scrollY; renderProjectTableView(tvPid); scrollTo(0,y); }
async function tvBulkArchive(){

/* Permanent delete — admin only, typed confirmation, shows what is going. */
function tvBulkDelete(){
  const ids=[...tvSel]; if(!ids.length) return;
  if(!isAdmin()) return toast('Only an admin can permanently delete tasks', true);
  const rows = (S._tasks||[]).filter(t=>tvSel.has(t.id));
  const preview = rows.slice(0,8).map(t=>`<li>${esc(t.title||'(untitled)')}</li>`).join('')
    + (rows.length>8? `<li style="color:var(--ink3)">…and ${rows.length-8} more</li>`:'');

    <div class="modal-body">
      <div class="danger-note">
        <b>This cannot be undone.</b> Subtasks, comments and attachments on these tasks go with them.
        Use <b>Archive</b> instead if you just want them out of the board.
      </div>
      <ul style="margin:0 0 14px 18px;font-size:13px;color:var(--ink2);max-height:170px;overflow:auto">${preview}</ul>

      <input id="bd-confirm" inputmode="numeric" autocomplete="off" placeholder="${ids.length}">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-ghost" id="bd-archive">Archive instead</button>
      <button class="btn btn-danger" id="bd-go" disabled>Delete permanently</button>
    </div>`);
  const inp=m.querySelector('#bd-confirm'), go=m.querySelector('#bd-go');
  inp.oninput = ()=>{ go.disabled = inp.value.trim() !== String(ids.length); };
  m.querySelector('#bd-archive').onclick = ()=>{ closeModals(); tvBulkArchive(); };
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {error}=await db.from('tasks').delete().in('id',ids);
    if(error){ go.disabled=false; go.textContent='Delete permanently'; return toast(error.message, true); }
    S._tasksAll = (S._tasksAll||[]).filter(t=>!tvSel.has(t.id));

    const y=scrollY; renderProjectTableView(tvPid); scrollTo(0,y);
  };
  setTimeout(()=>inp.focus(), 30);
}
function tvQuickAdd(e, pid, gid){
  if(e.key!=='Enter') return;

  db.from('tasks').insert({project_id:pid, title, group_id:gid, status:'todo', priority:'normal', created_by:S.me.id, position:maxPos+1}).select().single().then(({data,error})=>{
    if(error){ toast(error.message, true); inp.disabled=false; return; }
    S._tasks.push(data);
    const y=scrollY; renderProjectTableView(pid); scrollTo(0,y);
