      <label>Color</label>
      <div id="gr-colors" style="display:flex;gap:8px;margin-top:4px">${palette.map(c=>
        `<span data-c="${c}" onclick="[...this.parentNode.children].forEach(x=>x.style.outline='none');this.style.outline='2px solid var(--ink)';this.parentNode.dataset.sel=this.dataset.c"
          style="width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;outline:${c===cur?'2px solid var(--ink)':'none'};outline-offset:2px"></span>`).join('')}</div>
    </div>
    <div class="modal-foot">
      ${g? `<button class="btn btn-ghost" id="gr-del" style="color:var(--red)">Delete group</button>`:''}
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" id="gr-save">${g?'Save':'Add group'}</button>
    </div>`);
  m.querySelector('#gr-colors').dataset.sel = cur;
  if(g){
    m.querySelector('#gr-del').onclick = async ()=>{
      const {error}=await db.from('project_groups').delete().eq('id',g.id);
      if(error) return toast(error.message, true);
      closeModals(); toast('Group deleted (tasks kept)'); renderProject(pid);
    };
  }
  m.querySelector('#gr-save').onclick = async ()=>{
    const name=m.querySelector('#gr-name').value.trim(); if(!name) return toast('Group name is required', true);
    const color=m.querySelector('#gr-colors').dataset.sel;
    let error;
    if(g){ ({error} = await db.from('project_groups').update({name, color}).eq('id',g.id)); }
    else { ({error} = await db.from('project_groups').insert({project_id:pid, name, color, position:(S._groups||[]).length})); }
    if(error) return toast(error.message, true);
    closeModals(); toast(g?'Group updated':'Group added'); renderProject(pid);
  };
}
async function tvCore(tid, field, val){
  const t=S._tasks.find(x=>x.id===tid); if(!t) return;
  const old=t[field]; t[field]=val;
  const {error}=await db.from('tasks').update({[field]:val}).eq('id',tid);
  if(error){ t[field]=old; toast(error.message, true); }
  else if(field==='status') logActivity('task', tid, 'status_changed', {from:old, to:val});
}
async function tvCustom(tid, fid, val){
  const t=S._tasks.find(x=>x.id===tid); if(!t) return;
  t.custom = Object.assign({}, t.custom||{});
  if(val===''||val===null){ delete t.custom[fid]; } else { t.custom[fid]=val; }
  const {error}=await db.from('tasks').update({custom:t.custom}).eq('id',tid);
  if(error) toast(error.message, true);
}
function addColumnModal(pid){ columnModal(pid, null); }
function editColumnModal(fid, pid){ const f=(S._fields||[]).find(x=>x.id===fid); if(f) columnModal(pid, f); }
function columnModal(pid, f){
  const types=[['text','Text'],['number','Number'],['date','Date'],['select','Dropdown'],['checkbox','Checkbox'],['person','Person'],['brand','Brand']];
  const m = modal(`<div class="modal-head"><h2>${f?'Edit column':'New column'}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Column name <span class="req">*</span></label><input id="cf-label" value="${f? esc(f.label):''}" placeholder="e.g. Store Location">
      <label>Type</label><select id="cf-type" ${f?'disabled':''}>${types.map(([k,l])=>`<option value="${k}" ${f&&f.ftype===k?'selected':''}>${l}</option>`).join('')}</select>
      <div id="cf-opts-wrap" style="display:${(f? f.ftype:'text')==='select'?'block':'none'}">
        <label>Dropdown options (one per line)</label>
        <textarea id="cf-opts" rows="4" placeholder="Option A&#10;Option B">${f? esc((f.options||[]).join('\n')):''}</textarea>
      </div>
      ${f? `<p style="color:var(--ink3);font-size:12.5px;margin-top:10px">Type cannot be changed after creation. Deleting a column keeps task data but hides it.</p>`:''}
    </div>
    <div class="modal-foot">
      ${f? `<button class="btn btn-ghost" id="cf-del" style="color:var(--red)">Delete column</button>`:''}
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" id="cf-save">${f?'Save':'Add column'}</button>
    </div>`);
  m.querySelector('#cf-type').onchange = e=>{ m.querySelector('#cf-opts-wrap').style.display = e.target.value==='select'?'block':'none'; };
  if(f){
    m.querySelector('#cf-del').onclick = async ()=>{
      const {error}=await db.from('project_fields').delete().eq('id',f.id);
      if(error) return toast(error.message, true);
      closeModals(); toast('Column deleted'); renderProject(pid);
    };
  }
  m.querySelector('#cf-save').onclick = async ()=>{
    const label=m.querySelector('#cf-label').value.trim(); if(!label) return toast('Column name is required', true);
    const ftype=m.querySelector('#cf-type').value;
    const options = ftype==='select'? m.querySelector('#cf-opts').value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
    if(ftype==='select' && !options.length) return toast('Add at least one dropdown option', true);
    let error;
    if(f){ ({error} = await db.from('project_fields').update({label, options}).eq('id',f.id)); }
    else { ({error} = await db.from('project_fields').insert({project_id:pid, label, ftype, options, position:(S._fields||[]).length, created_by:S.me.id})); }
    if(error) return toast(error.message, true);
    closeModals(); toast(f?'Column updated':'Column added'); renderProject(pid);
  };
}
async function projectMembersModal(pid){
  const {data:members} = await db.from('project_members').select('*').eq('project_id',pid);
  const memberIds = new Set((members||[]).map(m=>m.user_id));
  const externals = S.profiles.filter(p=>['partner','freelancer'].includes(p.role));
  const m = modal(`<div class="modal-head"><h2>Project members (partner access)</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <p style="color:var(--ink2);font-size:13px;margin-top:8px">Internal staff can see every project. Add partners or freelancers here to give them access to <b>this project only</b>.</p>
      ${externals.length? externals.map(p=>`
        <div class="chk"><input type="checkbox" data-uid="${p.id}" ${memberIds.has(p.id)?'checked':''}>
        ${avatar(p,true)} <span>${esc(p.full_name)} <span style="color:var(--ink3)">· ${p.role} · ${esc(p.email)}</span></span></div>`).join('')
      : '<div class="empty">No partner or freelancer accounts yet. Create them in Admin → Users.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="pm-save">Save</button></div>`);
  m.querySelector('#pm-save').onclick = async ()=>{
    const want = new Set([...m.querySelectorAll('input[data-uid]:checked')].map(i=>i.dataset.uid));
    const add=[...want].filter(u=>!memberIds.has(u)).map(user_id=>({project_id:pid,user_id}));
    const rm=[...memberIds].filter(u=>!want.has(u));
    if(add.length) await db.from('project_members').insert(add);
    if(rm.length) await db.from('project_members').delete().eq('project_id',pid).in('user_id',rm);
    closeModals(); toast('Members updated');
  };
}
</script>
<script>
/* ================= TASK MODAL ================= */
function newTaskModal(projectId, status='todo', groupId=null){
  const p = projById(projectId);
  const m = modal(`<div class="modal-head"><h2>New task</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Title <span class="req">*</span></label><input id="tk-title" placeholder="What needs to be done?">
      <label>Description</label><textarea id="tk-desc" rows="3"></textarea>
      <div class="field-grid">
        <div><label>Status</label><select id="tk-status">${STATUSES.map(s=>`<option value="${s.k}" ${s.k===status?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div><label>Priority</label><select id="tk-prio">${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k==='normal'?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div><label>Assignee</label><select id="tk-assignee"><option value="">Unassigned</option>${assigneeOptions(projectId)}</select></div>
        <div><label>Due date</label><input id="tk-due" type="date"></div>
      </div>
      <label>Tags (comma separated)</label><input id="tk-tags" placeholder="e.g. 9.9, shopee">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tk-save">Create task</button></div>`);
  m.querySelector('#tk-title').focus();
  m.querySelector('#tk-save').onclick = async ()=>{
    const title=m.querySelector('#tk-title').value.trim(); if(!title) return toast('Title is required', true);
    const maxPos = Math.max(0, ...(S._tasks||[]).map(t=>t.position||0));
    const {data, error} = await db.from('tasks').insert({
      project_id:projectId, title, description:m.querySelector('#tk-desc').value.trim(),
      status:m.querySelector('#tk-status').value, priority:m.querySelector('#tk-prio').value,
      assignee_id:m.querySelector('#tk-assignee').value||null, due_date:m.querySelector('#tk-due').value||null,
      tags:m.querySelector('#tk-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      created_by:S.me.id, position:maxPos+1, group_id:groupId
    }).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Task created'); logActivity('task', data.id, 'created', {title});
    if(S.route.view==='project') renderProject(projectId); else renderHome();
  };
}
function assigneeOptions(projectId, selected){
  // staff can assign anyone; also include project members (partners)
  return S.profiles.filter(p=>p.active).map(p=>
    `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.full_name)} (${p.role})</option>`).join('');
}
async function openTask(id){
  const [{data:t}, {data:chk}, {data:comments}, {data:atts}, {data:subs}] = await Promise.all([
    db.from('tasks').select('*').eq('id',id).single(),
    db.from('task_checklist').select('*').eq('task_id',id).order('position'),
    db.from('comments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('attachments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('subtasks').select('*').eq('task_id',id).order('position').order('created_at'),
  ]);
  if(!t) return toast('Task not found', true);
  const p = projById(t.project_id);
  const m = modal(`<div class="modal-head">
      <h2><span id="tv-title-view">${esc(t.title)}</span></h2>
      ${isStaff()? `<button class="x" title="Delete task" onclick="deleteTask('${t.id}','${t.project_id}')" style="font-size:12px;font-weight:600">Delete</button>`:''}
      <button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="field-grid">
        <div><label>Status</label><select id="tv-status" ${canEdit()?'':'disabled'}>${STATUSES.map(s=>`<option value="${s.k}" ${s.k===t.status?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div><label>Priority</label><select id="tv-prio" ${canEdit()?'':'disabled'}>${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k===t.priority?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div><label>Assignee</label><select id="tv-assignee" ${canEdit()?'':'disabled'}><option value="">Unassigned</option>${assigneeOptions(t.project_id, t.assignee_id)}</select></div>
        <div><label>Due date</label><input id="tv-due" type="date" value="${t.due_date||''}" ${canEdit()?'':'disabled'}></div>
      </div>
      <label>Title</label><input id="tv-title" value="${esc(t.title)}" ${canEdit()?'':'disabled'}>
      <label>Description</label><textarea id="tv-desc" rows="3" ${canEdit()?'':'disabled'}>${esc(t.description)}</textarea>
      <label>Subtasks</label>
      <div id="tv-subprog">${subProgressBar(subs||[])}</div>
      <div id="tv-subs">${(subs||[]).map(stRow).join('')}</div>
      ${canCreate()? `<div style="display:flex;gap:8px;margin-top:6px"><input id="tv-sub-new" placeholder="Add a subtask…" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-sub-add">Add</button></div>`:''}
      <label>Checklist</label>
      <div id="tv-chk">${(chk||[]).map(c=>chkRow(c)).join('')}</div>
      ${canEdit()? `<div style="display:flex;gap:8px;margin-top:6px"><input id="tv-chk-new" placeholder="Add checklist item…" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-chk-add">Add</button></div>`:''}
      <label>Attachments</label>
      <div id="tv-atts">${(atts||[]).length? atts.map(attLink).join('') : '<span style="color:var(--ink3);font-size:13px">No files attached</span>'}</div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="tv-files" type="file" multiple style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-files-add">Upload</button></div>
      <label>Comments</label>
      <div id="tv-comments">${(comments||[]).map(commentRow).join('')||'<div style="color:var(--ink3);font-size:13px">No comments yet</div>'}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="tv-comment" placeholder="Write a comment…" style="flex:1">
        <button class="btn btn-primary btn-sm" id="tv-comment-add">Send</button></div>
      <div style="margin-top:14px;font-size:11.5px;color:var(--ink3)">Created ${fmtDateTime(t.created_at)} by ${esc(prof(t.created_by)?.full_name||'—')} · in ${esc(p?.name||'')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button>${canEdit()? `<button class="btn btn-primary" id="tv-save">Save changes</button>`:''}</div>`, true);

  if(m.querySelector('#tv-save')) m.querySelector('#tv-save').onclick = async ()=>{
    const upd = {
      title:m.querySelector('#tv-title').value.trim()||t.title,
      description:m.querySelector('#tv-desc').value,
      status:m.querySelector('#tv-status').value, priority:m.querySelector('#tv-prio').value,
      assignee_id:m.querySelector('#tv-assignee').value||null, due_date:m.querySelector('#tv-due').value||null,
    };
    const {error} = await db.from('tasks').update(upd).eq('id',t.id);
    if(error) return toast(error.message, true);
    closeModals(); toast('Task saved'); logActivity('task', t.id, 'updated', {});
    if(S.route.view==='project') renderProject(t.project_id); else if(S.route.view==='home') renderHome();
  };
  if(m.querySelector('#tv-sub-add')) m.querySelector('#tv-sub-add').onclick = async ()=>{
    const title = m.querySelector('#tv-sub-new').value.trim(); if(!title) return;
    const {data, error} = await db.from('subtasks').insert({task_id:t.id, title, created_by:S.me.id, position:(m.querySelectorAll('.strow').length)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-subs').insertAdjacentHTML('beforeend', stRow(data));
    m.querySelector('#tv-sub-new').value=''; refreshSubProg(t.id);
  };
  if(m.querySelector('#tv-chk-add')) m.querySelector('#tv-chk-add').onclick = async ()=>{
    const label = m.querySelector('#tv-chk-new').value.trim(); if(!label) return;
    const {data, error} = await db.from('task_checklist').insert({task_id:t.id, label, position:(chk?.length||0)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-chk').insertAdjacentHTML('beforeend', chkRow(data));
    m.querySelector('#tv-chk-new').value='';
  };
  m.querySelector('#tv-files-add').onclick = async ()=>{
    const n = await uploadAttachments('task', t.id, m.querySelector('#tv-files'));
    if(n){ toast(n + ' file' + (n>1?'s':'') + ' uploaded'); const {data:na} = await db.from('attachments').select('*').eq('entity_type','task').eq('entity_id',t.id).order('created_at');
      m.querySelector('#tv-atts').innerHTML = (na||[]).map(attLink).join(''); m.querySelector('#tv-files').value=''; }
  };
  m.querySelector('#tv-comment-add').onclick = async ()=>{
    const body = m.querySelector('#tv-comment').value.trim(); if(!body) return;
    const {data, error} = await db.from('comments').insert({entity_type:'task', entity_id:t.id, author_id:S.me.id, body}).select().single();
    if(error) return toast(error.message, true);
    const box = m.querySelector('#tv-comments');
    if(box.firstElementChild && !box.firstElementChild.classList.contains('comment')) box.innerHTML='';
    box.insertAdjacentHTML('beforeend', commentRow(data));
    m.querySelector('#tv-comment').value='';
  };
}
function subProgressBar(subs){
  const total=subs.length, done=subs.filter(s=>s.status==='done').length;
  if(!total) return '';
  const pct = Math.round(done/total*100);
  return `<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><span class="prog-lbl">${done}/${total} done</span></div>`;
}
async function refreshSubProg(taskId){
  const {data:subs} = await db.from('subtasks').select('status').eq('task_id',taskId);
  const box = document.getElementById('tv-subprog'); if(box) box.innerHTML = subProgressBar(subs||[]);
}
function stRow(s){
  if(!canEdit()) return `<div class="strow ro" id="st-${s.id}">
    <span class="tv-fill mini" style="background:${STATUSES.find(x=>x.k===s.status)?.color||'#8E93A8'}">${esc(STATUSES.find(x=>x.k===s.status)?.label||s.status)}</span>
    <span style="font-size:12.5px">${esc(s.title)}</span><span style="font-size:12px;color:var(--ink3)">${esc(s.stype||'')}</span>
    <span style="font-size:12px">${s.assignee_id? esc(prof(s.assignee_id)?.full_name||''):''}</span>
    <span style="font-size:12px;color:var(--ink3)">${s.due_date||''}</span><span></span></div>`;
  return `<div class="strow" id="st-${s.id}" data-task="${s.task_id}">
    <select onchange="stUpd('${s.id}','status',this.value,'${s.task_id}')">${STATUSES.map(x=>`<option value="${x.k}" ${x.k===s.status?'selected':''}>${x.label}</option>`).join('')}</select>
    <input type="text" value="${esc(s.title)}" onchange="stUpd('${s.id}','title',this.value.trim(),'${s.task_id}')">
    <input type="text" value="${esc(s.stype||'')}" placeholder="Type" onchange="stUpd('${s.id}','stype',this.value.trim()||null,'${s.task_id}')">
    <select onchange="stUpd('${s.id}','assignee_id',this.value||null,'${s.task_id}')"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active && !(p.email||'').startsWith('forms+')).map(p=>`<option value="${p.id}" ${p.id===s.assignee_id?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    <input type="date" value="${s.due_date||''}" onchange="stUpd('${s.id}','due_date',this.value||null,'${s.task_id}')">
    <button class="del" onclick="delSubtask('${s.id}','${s.task_id}')">✕</button></div>`;
}
async function stUpd(id, field, val, taskId){
  const {error} = await db.from('subtasks').update({[field]:val}).eq('id',id);
  if(error) return toast(error.message, true);
  if(field==='status') refreshSubProg(taskId);
}
async function delSubtask(id, taskId){
  const {error} = await db.from('subtasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  document.getElementById('st-'+id)?.remove(); refreshSubProg(taskId);
}
function chkRow(c){
  if(!canEdit()) return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} disabled><span>${esc(c.label)}</span></div>`;
  return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} onchange="toggleChk('${c.id}', this.checked)">
    <span>${esc(c.label)}</span>
    <button class="del" onclick="delChk('${c.id}')">✕</button></div>`;
}
async function toggleChk(id, done){
  await db.from('task_checklist').update({done}).eq('id',id);
  const row = document.getElementById('chk-'+id); if(row) row.classList.toggle('done', done);
}
async function delChk(id){
  await db.from('task_checklist').delete().eq('id',id);
  document.getElementById('chk-'+id)?.remove();
}
function commentRow(c){
  const a = prof(c.author_id);
  return `<div class="comment">${avatar(a,true)}<div class="body"><b>${esc(a?.full_name||'Unknown')}</b><span class="when">${fmtDateTime(c.created_at)}</span><p>${esc(c.body)}</p></div></div>`;
}
async function deleteTask(id, projectId){
  if(!confirm('Delete this task permanently?')) return;
  const {error} = await db.from('tasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  closeModals(); toast('Task deleted'); renderProject(projectId);
}
</script>
<script>
/* ================= REQUESTS ================= */
let reqTab = 'mine';
async function renderRequests(){
  setTopbar('Requests', `<button class="btn btn-primary btn-sm" onclick="newRequestFlow()">＋ New request</button>`);
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  if(!isStaff()) reqTab='mine';
  let q = db.from('requests').select('*').order('created_at',{ascending:false});
  if(reqTab==='mine') q = q.eq('submitted_by', S.me.id);
  if(reqTab==='open') q = q.in('status',['submitted','in_review','approved','in_progress']);
  const {data:reqs, error} = await q;
  if(error){ C.innerHTML=`<div class="card empty">${esc(error.message)}</div>`; return; }
  C.innerHTML = `
    <div class="page-head"><h1>Requests</h1>
      ${isStaff()? `<div class="tabs">
        <button class="tab ${reqTab==='open'?'active':''}" onclick="reqTab='open';renderRequests()">Open queue</button>
        <button class="tab ${reqTab==='all'?'active':''}" onclick="reqTab='all';renderRequests()">All</button>
        <button class="tab ${reqTab==='mine'?'active':''}" onclick="reqTab='mine';renderRequests()">Mine</button>
      </div>`:''}
      <div class="actions"><button class="btn btn-primary" onclick="newRequestFlow()">＋ New request</button></div></div>
    <div class="card">${(reqs||[]).length? requestTable(reqs) : `<div class="empty">No requests here yet</div>`}</div>`;
}
function newRequestFlow(){
  const m = modal(`<div class="modal-head"><h2>What do you need?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body" style="padding-top:14px"><div class="rt-grid">
      ${S.requestTypes.map(rt=>`<button class="rt-pick" onclick="newRequestForm('${rt.id}')">
        <span><b>${esc(rt.name)}</b><span>${esc(rt.description)}</span>
        <span style="display:block;margin-top:5px;font-size:11px;color:var(--ink3)">SLA ${rt.sla_hours}h${rt.approval_required?' · needs approval':''}</span></span>
      </button>`).join('')}
    </div></div>`, true);
}
function fieldInput(f){
  const req = f.required? '<span class="req">*</span>':'';
  if(f.type==='textarea') return `<label>${esc(f.label)} ${req}</label><textarea data-fk="${f.key}" rows="3"></textarea>`;
  if(f.type==='select') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select —</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='brand') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select brand —</option>${(S.brandsList||[]).filter(b=>b.active).map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`;
  if(f.type==='multiselect') return `<label>${esc(f.label)} ${req}</label><div style="display:flex;flex-wrap:wrap;gap:4px 16px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff">${(f.options||[]).map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink);cursor:pointer"><input type="checkbox" data-fkm="${f.key}" value="${esc(o)}" style="width:15px;height:15px;accent-color:var(--accent)">${esc(o)}</label>`).join('')}</div>`;
  return `<label>${esc(f.label)} ${req}</label><input data-fk="${f.key}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}">`;
}
function readField(m, f){
  if(f.type==='multiselect') return [...m.querySelectorAll(`input[data-fkm="${f.key}"]:checked`)].map(i=>i.value).join(', ');
  return m.querySelector(`[data-fk="${f.key}"]`)?.value?.trim()||'';
}
function newRequestForm(rtId){
  closeModals();
  const rt = S.requestTypes.find(x=>x.id===rtId); if(!rt) return;
  const m = modal(`<div class="modal-head"><h2>${esc(rt.name)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>${esc(rt.title_label||'Request title')} <span class="req">*</span></label><input id="rq-title" placeholder="${esc(rt.title_hint||'Short summary of this request')}">
      ${(rt.fields||[]).map(fieldInput).join('')}
      <label>Priority</label><select id="rq-prio">${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k==='normal'?'selected':''}>${x.label}</option>`).join('')}</select>
      <label>Attachments (price lists, approvals, briefs…)</label><input id="rq-files" type="file" multiple>
      <p style="margin-top:14px;font-size:12px;color:var(--ink3)">Response SLA: ${rt.sla_hours} hours${rt.approval_required? ' · This request requires approval before work starts.':''}</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="rq-save">Submit request</button></div>`, true);
  m.querySelector('#rq-save').onclick = async ()=>{
    const title = m.querySelector('#rq-title').value.trim(); if(!title) return toast('Title is required', true);
    const data = {};
    for(const f of (rt.fields||[])){
      const v = readField(m, f);
      if(f.required && !v) return toast(`"${f.label}" is required`, true);
      data[f.key]=v;
    }
    const btn = m.querySelector('#rq-save'); btn.disabled = true; btn.textContent = 'Submitting…';
    const {data:req, error} = await db.from('requests').insert({
      request_type_id:rt.id, title, data, priority:m.querySelector('#rq-prio').value, submitted_by:S.me.id
    }).select().single();
    if(error){ btn.disabled=false; btn.textContent='Submit request'; return toast(error.message, true); }
    const nUp = await uploadAttachments('request', req.id, m.querySelector('#rq-files'));
    closeModals(); toast('Request WO-' + (req.ticket_no||'') + ' submitted' + (nUp? ' · '+nUp+' file'+(nUp>1?'s':'')+' attached':'')); logActivity('request', req.id, 'submitted', {title});
    if(S.route.view==='requests') renderRequests(); else renderHome();
  };
}
async function openRequest(id){
  const [{data:r}, {data:comments}, {data:apprs}, {data:atts}] = await Promise.all([

    db.from('comments').select('*').eq('entity_type','request').eq('entity_id',id).order('created_at'),

  const staff = isStaff();
  const canEditStatus = staff || r.assigned_to===S.me.id;
  const m = modal(`<div class="modal-head"><h2>${r.ticket_no? `<span style="color:var(--ink3);font-size:13px;font-weight:700">WO-${r.ticket_no}</span> `:''}${esc(r.title)}</h2>${reqStatusChip(r.status)}<button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        ${prioChip(r.priority)} ${slaBadge(r.sla_due_at, r.status)}
        <span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${rt? esc(rt.name):''}</span>
      </div>
      <div class="field-grid" style="margin-top:14px">
        <div class="kv"><b>Submitted by</b>${r.guest_name? esc(r.guest_name)+' · '+esc(r.guest_email)+' (web form)' : esc(prof(r.submitted_by)?.full_name||'—')} · ${fmtDateTime(r.created_at)}</div>
        <div class="kv"><b>Assigned to</b>${esc(prof(r.assigned_to)?.full_name||'Unassigned')}</div>
      </div>
      ${Object.keys(r.data||{}).length? `<div style="background:var(--gray-soft);border-radius:10px;padding:12px 14px;margin-top:6px">
        ${(rt?.fields||[]).map(f=> r.data[f.key]? `<div class="kv"><b>${esc(f.label)}</b>${esc(r.data[f.key])}</div>`:'').join('')}</div>`:''}
      ${(apprs||[]).length? `<label>Approvals</label>${apprs.map(a=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px">
          ${avatar(prof(a.approver_id),true)} ${esc(prof(a.approver_id)?.full_name||'')}
          <span class="chip" style="background:${a.status==='approved'?'var(--green-soft);color:var(--green)':a.status==='rejected'?'var(--red-soft);color:var(--red)':'var(--amber-soft);color:var(--amber)'}">${a.status}</span>
          ${a.note? `<span style="color:var(--ink2)">· ${esc(a.note)}</span>`:''}
          ${a.status==='pending' && a.approver_id===S.me.id? `
            <span style="margin-left:auto"><button class="btn btn-green btn-sm" onclick="decideApproval('${a.id}','approved','${r.id}')">Approve</button>
            <button class="btn btn-danger btn-sm" onclick="decideApproval('${a.id}','rejected','${r.id}')">Reject</button></span>`:''}
        </div>`).join('')}`:''}
      ${staff? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <select id="rv-status" style="width:auto">${REQ_STATUSES.map(s=>`<option value="${s.k}" ${s.k===r.status?'selected':''}>${s.label}</option>`).join('')}</select>
        <select id="rv-assign" style="width:auto"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===r.assigned_to?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
        <button class="btn btn-ghost btn-sm" id="rv-update">Update</button>
        <button class="btn btn-ghost btn-sm" id="rv-askappr">Ask approval</button>
        ${!r.project_id? `<button class="btn btn-ghost btn-sm" onclick="convertToTask('${r.id}')">Convert to task</button>`:'<span class="chip" style="background:var(--green-soft);color:var(--green)">Linked to project task</span>'}
      </div>`:''}
      <label>Attachments</label>
      <div id="rv-atts">${(atts||[]).length? atts.map(attLink).join('') : '<span style="color:var(--ink3);font-size:13px">No files attached</span>'}</div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="rv-files" type="file" multiple style="flex:1">
        <button class="btn btn-ghost btn-sm" id="rv-files-add">Upload</button></div>
      <label>Comments</label>
      <div id="rv-comments">${(comments||[]).map(commentRow).join('')||'<div style="color:var(--ink3);font-size:13px">No comments yet</div>'}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="rv-comment" placeholder="Write a comment…" style="flex:1">

    const status = m.querySelector('#rv-status').value;
    const assigned_to = m.querySelector('#rv-assign').value||null;
    const upd = {status, assigned_to};

    const {error} = await db.from('requests').update(upd).eq('id',r.id);
    if(error) return toast(error.message, true);

    if(S.route.view==='requests') renderRequests(); else renderHome();
  });
  m.querySelector('#rv-cancel')?.addEventListener('click', async ()=>{
    if(!confirm('Cancel this request?')) return;
    await db.from('requests').update({status:'cancelled'}).eq('id',r.id);
    closeModals(); toast('Request cancelled');
    if(S.route.view==='requests') renderRequests(); else renderHome();
  });
  m.querySelector('#rv-files-add').onclick = async ()=>{
    const n = await uploadAttachments('request', r.id, m.querySelector('#rv-files'));
    if(n){ toast(n + ' file' + (n>1?'s':'') + ' uploaded'); const {data:na} = await db.from('attachments').select('*').eq('entity_type','request').eq('entity_id',r.id).order('created_at');
      m.querySelector('#rv-atts').innerHTML = (na||[]).map(attLink).join(''); m.querySelector('#rv-files').value=''; }
  };
  m.querySelector('#rv-comment-add').onclick = async ()=>{
    const body = m.querySelector('#rv-comment').value.trim(); if(!body) return;
    const {data, error} = await db.from('comments').insert({entity_type:'request', entity_id:r.id, author_id:S.me.id, body}).select().single();
    if(error) return toast(error.message, true);
    const box = m.querySelector('#rv-comments');
    if(box.firstElementChild && !box.firstElementChild.classList.contains('comment')) box.innerHTML='';
    box.insertAdjacentHTML('beforeend', commentRow(data));
    m.querySelector('#rv-comment').value='';
  };
}
function requestApprovalModal(reqId, title){
  const staffList = S.profiles.filter(p=>p.active && ['admin','internal','management'].includes(p.role));
  const m = modal(`<div class="modal-head"><h2>Ask for approval</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Approver</label><select id="ap-who">${staffList.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${p.role})</option>`).join('')}</select>
      <label>What are they approving?</label><input id="ap-title" value="Approve: ${esc(title)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="ap-save">Send</button></div>`);
  m.querySelector('#ap-save').onclick = async ()=>{
    const {error} = await db.from('approvals').insert({
      request_id:reqId, approver_id:m.querySelector('#ap-who').value,
      requested_by:S.me.id, title:m.querySelector('#ap-title').value.trim()
    });
    if(error) return toast(error.message, true);
    await db.from('requests').update({status:'in_review'}).eq('id',reqId).in('status',['submitted']);
    closeModals(); toast('Approval requested');
  };
}
async function convertToTask(reqId){
  const {data:r} = await db.from('requests').select('*').eq('id',reqId).single();
  if(!r) return;
  const rt = S.requestTypes.find(x=>x.id===r.request_type_id);
  const wsId = rt?.default_workspace_id || S.workspaces[0]?.id;
  const projs = S.projects.filter(p=>p.status==='active');
  const m = modal(`<div class="modal-head"><h2>Convert to task</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Into project</label><select id="cv-proj">${projs.map(p=>{
        const w=wsById(p.workspace_id);
        return `<option value="${p.id}" ${p.workspace_id===wsId?'selected':''}>${w?esc(w.name)+' · ':''}${esc(p.name)}</option>`;}).join('')}</select>
      <label>Assignee</label><select id="cv-assignee"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===r.assigned_to?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="cv-save">Create task</button></div>`);
  m.querySelector('#cv-save').onclick = async ()=>{
    const project_id = m.querySelector('#cv-proj').value; if(!project_id) return toast('Pick a project', true);
    const desc = (rt?.fields||[]).map(f=> r.data[f.key]? `${f.label}: ${r.data[f.key]}`:'').filter(Boolean).join('\n');
    const {data:task, error} = await db.from('tasks').insert({
      project_id, title:r.title, description:`From request (${rt?.name||'request'}):\n${desc}`,
      priority:r.priority, assignee_id:m.querySelector('#cv-assignee').value||null,
      due_date: r.sla_due_at? r.sla_due_at.slice(0,10):null, request_id:r.id, created_by:S.me.id,
      tags:['request']
    }).select().single();
    if(error) return toast(error.message, true);
    await db.from('requests').update({project_id, status: r.status==='submitted'||r.status==='in_review'?'in_progress':r.status}).eq('id',r.id);
    closeModals(); toast('Task created from request'); logActivity('request', r.id, 'converted_to_task', {task:task.id});
    location.hash = '#/project/'+project_id;
  };
}

/* ================= APPROVALS ================= */
let apprTab='pending';
async function renderApprovals(){
  setTopbar('Approvals');
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  let q = db.from('approvals').select('*').order('created_at',{ascending:false});
  if(apprTab==='pending') q=q.eq('status','pending').eq('approver_id',S.me.id);
  if(apprTab==='requested') q=q.eq('requested_by',S.me.id);
  const {data:apprs} = await q;
  C.innerHTML = `
    <div class="page-head"><h1>Approvals</h1>
      <div class="tabs">
        <button class="tab ${apprTab==='pending'?'active':''}" onclick="apprTab='pending';renderApprovals()">For me</button>
        <button class="tab ${apprTab==='requested'?'active':''}" onclick="apprTab='requested';renderApprovals()">Requested by me</button>
        ${isStaff()? `<button class="tab ${apprTab==='all'?'active':''}" onclick="apprTab='all';renderApprovals()">All</button>`:''}
      </div></div>
    <div class="card">${(apprs||[]).length?
      `<table class="tbl"><thead><tr><th>Approval</th><th>Approver</th><th>Requested by</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>
      ${apprs.map(a=>`<tr>
        <td style="font-weight:600">${esc(a.title||'Approval')}</td>
        <td>${avatar(prof(a.approver_id),true)}</td>
        <td>${avatar(prof(a.requested_by),true)}</td>
        <td><span class="chip" style="background:${a.status==='approved'?'var(--green-soft);color:var(--green)':a.status==='rejected'?'var(--red-soft);color:var(--red)':'var(--amber-soft);color:var(--amber)'}">${a.status}</span>${a.note?` <span style="color:var(--ink2);font-size:12px">${esc(a.note)}</span>`:''}</td>
        <td style="color:var(--ink2)">${fmtDateTime(a.created_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          ${a.request_id? `<button class="btn btn-ghost btn-sm" onclick="openRequest('${a.request_id}')">View</button>`:''}
          ${a.status==='pending'&&a.approver_id===S.me.id? `<button class="btn btn-green btn-sm" onclick="decideApproval('${a.id}','approved')">Approve</button>
          <button class="btn btn-danger btn-sm" onclick="decideApproval('${a.id}','rejected')">Reject</button>`:''}</td>
      </tr>`).join('')}</tbody></table>`
      : `<div class="empty">Nothing here — all clear</div>`}</div>`;
}
async function decideApproval(id, status, reqIdToRefresh){
  let note = '';
  if(status==='rejected'){ note = prompt('Reason for rejection (optional):')||''; }
  const {data:a, error} = await db.from('approvals').update({status, note, decided_at:new Date().toISOString()}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  // reflect on the request if linked and staff
  if(a?.request_id){
    try{ await db.from('requests').update({status: status==='approved'?'approved':'rejected', decided_by:S.me.id, decided_at:new Date().toISOString(), decision_note:note}).eq('id',a.request_id).in('status',['submitted','in_review']); }catch(e){}
  }
  toast(status==='approved'? 'Approved':'Rejected'); logActivity('approval', id, status, {});
  updateApprovalBadge();
  closeModals();
  if(S.route.view==='approvals') renderApprovals(); else if(S.route.view==='home') renderHome(); else if(reqIdToRefresh) openRequest(reqIdToRefresh);
}
</script>
<script>
/* ================= DASHBOARD ================= */
let dashWs = 'all';
async function renderDashboard(){
  if(!isStaff() && !isRequester()){ location.hash='#/home'; return; }
  setTopbar('Dashboard', `<select id="dash-ws" style="width:auto;min-width:200px" onchange="dashWs=this.value;renderDashboard()">
    <option value="all">All workspaces</option>
    ${S.workspaces.map(w=>`<option value="${w.id}" ${dashWs===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`);
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const [tks, reqs, apprs, wdg] = await Promise.all([
    db.from('tasks').select('id,project_id,title,status,priority,assignee_id,due_date,completed_at,created_at'),
    db.from('requests').select('id,ticket_no,title,status,sla_due_at,completed_at,created_at,request_type_id,decided_at,submitted_by,assigned_to'),
    db.from('approvals').select('id,status,request_id'),
    db.from('dashboard_widgets').select('*').eq('user_id', S.me.id).order('position'),
  ]);
  let tasks=tks.data||[], requests=reqs.data||[], approvals=apprs.data||[];
  S._widgets = wdg.data||[];
  if(!S._widgets.length && !S._widgetsSeeded){
    S._widgetsSeeded = true;
    const defaults = [
      {wtype:'bar',   title:'Open tasks by workspace', config:{entity:'tasks', groupBy:'workspace'}, position:0},
      {wtype:'donut', title:'Tasks by status',         config:{entity:'tasks', groupBy:'status'},    position:1},
      {wtype:'bar',   title:'Open workload by person', config:{entity:'tasks', groupBy:'assignee'},  position:2},
      {wtype:'list',  title:'My tasks due soon',       config:{entity:'tasks', show:'due7', mine:true}, position:3},
    ].map(w=>({...w, user_id:S.me.id}));
    const {data:seeded} = await db.from('dashboard_widgets').insert(defaults).select();
    S._widgets = seeded||[];
  }

  // workspace filter
  const wsSel = dashWs !== 'all' ? dashWs : null;
  const wsObj = wsSel ? wsById(wsSel) : null;
  const scopeProjects = wsSel ? S.projects.filter(p=>p.workspace_id===wsSel) : S.projects;
  if(wsSel){
    const pidSet = new Set(scopeProjects.map(p=>p.id));
    tasks = tasks.filter(t=>pidSet.has(t.project_id));
    const rtSet = new Set(S.requestTypes.filter(rt=>rt.default_workspace_id===wsSel).map(rt=>rt.id));
    requests = requests.filter(r=>rtSet.has(r.request_type_id));
    const reqSet = new Set(requests.map(r=>r.id));
    approvals = approvals.filter(a=>a.request_id && reqSet.has(a.request_id));
  }
  const open = tasks.filter(t=>t.status!=='done');
  const overdue = open.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const dueWeek = open.filter(t=>t.due_date && daysDiff(t.due_date)>=0 && daysDiff(t.due_date)<=7);
  const doneTasks = tasks.filter(t=>t.status==='done');
  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;
  const openReqs = requests.filter(r=>['submitted','in_review','approved','in_progress'].includes(r.status));
  const slaBreach = openReqs.filter(r=>r.sla_due_at && new Date(r.sla_due_at)<Date.now());
  const pendingAppr = approvals.filter(a=>a.status==='pending').length;

  // context shared by all widgets (already scoped to the selected workspace)
  S._dashCtx = {tasks, requests, open, overdue, dueWeek, doneTasks, openReqs, slaBreach, scopeProjects, wsSel};

  C.innerHTML = `
    <div class="page-head"><div><h1>${wsObj? esc(wsObj.name):'Operations Dashboard'}</h1><div class="sub">${wsObj? 'Workspace view — tasks, requests and approvals routed here':'Live view across all workspaces'}</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n accent">${open.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n ${overdue.length?'red':''}">${overdue.length}</div><div class="l">Overdue</div></div>
      <div class="stat"><div class="n amber">${dueWeek.length}</div><div class="l">Due within 7 days</div></div>
      <div class="stat"><div class="n ${onTimePct===null?'':onTimePct>=80?'green':onTimePct>=50?'amber':'red'}">${onTimePct===null?'—':onTimePct+'%'}</div><div class="l">On-time completion</div></div>
      <div class="stat"><div class="n">${openReqs.length}</div><div class="l">Open requests</div></div>
      <div class="stat"><div class="n ${slaBreach.length?'red':'green'}">${slaBreach.length}</div><div class="l">SLA breached</div></div>
      <div class="stat"><div class="n ${pendingAppr?'amber':''}">${pendingAppr}</div><div class="l">Pending approvals</div></div>
    </div>
    <div class="section-title" style="margin-top:22px;display:flex;align-items:center;gap:12px">Widgets
      <span style="flex:1"></span><button class="btn btn-primary btn-sm" onclick="widgetModal()">＋ Add widget</button></div>

/* ================= DASHBOARD WIDGETS ================= */
const W_SHOWS_TASKS = [['open','Open'],['overdue','Overdue'],['due7','Due within 7 days'],['done','Done'],['blocked','Blocked'],['review','In review'],['all','All']];
const W_SHOWS_REQS  = [['open','Open'],['sla','SLA breached'],['all','All']];
const W_GROUPS_TASKS= [['status','Status'],['priority','Priority'],['workspace','Workspace'],['project','Project'],['assignee','Assignee']];
const W_GROUPS_REQS = [['status','Status'],['type','Request type']];

function widgetTaskRows(cfg){
  const c=S._dashCtx;
  let rows = cfg.entity==='requests'? c.requests : c.tasks;
  if(cfg.entity==='requests'){
    if(cfg.show==='open') rows=c.openReqs;
    else if(cfg.show==='sla') rows=c.slaBreach;
  } else {
    if(cfg.show==='open') rows=c.open;
    else if(cfg.show==='overdue') rows=c.overdue;
    else if(cfg.show==='due7') rows=c.dueWeek;
    else if(cfg.show==='done') rows=c.doneTasks;
    else if(cfg.show==='blocked') rows=rows.filter(t=>t.status==='blocked');
    else if(cfg.show==='review') rows=rows.filter(t=>t.status==='review');
    if(cfg.mine) rows=rows.filter(t=>t.assignee_id===S.me.id);
  }
  return rows;
}
function widgetGroups(cfg){
  const c=S._dashCtx;
  if(cfg.entity==='requests'){
    if(cfg.groupBy==='type') return S.requestTypes.map(rt=>({label:rt.name, color:'#0F766E', n:c.requests.filter(r=>r.request_type_id===rt.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
    return REQ_STATUSES.map(s=>({label:s.label, color:s.color.startsWith('var')? '#0F766E':s.color, n:c.requests.filter(r=>r.status===s.k).length})).filter(x=>x.n>0);
  }
  if(cfg.groupBy==='priority') return PRIORITIES.map(p=>({label:p.label, color:p.color.startsWith('var')? '#8E93A8':p.color, n:c.open.filter(t=>t.priority===p.k).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='workspace') return (c.wsSel? c.scopeProjects.map(p=>({label:p.name,color:p.color,n:c.open.filter(t=>t.project_id===p.id).length}))
    : S.workspaces.map(w=>{ const pids=new Set(S.projects.filter(p=>p.workspace_id===w.id).map(p=>p.id)); return {label:w.name,color:w.color,n:c.open.filter(t=>pids.has(t.project_id)).length}; })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(cfg.groupBy==='project') return c.scopeProjects.map(p=>({label:p.name, color:p.color, n:c.open.filter(t=>t.project_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  if(cfg.groupBy==='assignee') return S.profiles.map(p=>({label:p.full_name, color:p.avatar_color||'#0F766E', n:c.open.filter(t=>t.assignee_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,8);
  return STATUSES.map(s=>({label:s.label, color:s.color, n:c.tasks.filter(t=>t.status===s.k).length})).filter(x=>x.n>0);
}
function donutSVG(rows){
  const total = rows.reduce((a,r)=>a+r.n,0);
  if(!total) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const C1=2*Math.PI*44; let acc=0;
  const segs = rows.map(r=>{
    const frac=r.n/total, off=acc; acc+=frac;
    return `<circle r="44" cx="60" cy="60" fill="none" stroke="${r.color}" stroke-width="16"
      stroke-dasharray="${(frac*C1).toFixed(2)} ${(C1-frac*C1).toFixed(2)}" stroke-dashoffset="${(-off*C1+C1/4).toFixed(2)}"></circle>`;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="140" height="140">${segs}
      <text x="60" y="58" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${total}</text>
      <text x="60" y="76" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink3);letter-spacing:.6px">TOTAL</text></svg>
    <div class="donut-legend">${rows.map(r=>`<div class="dl-row"><span class="dl-dot" style="background:${r.color}"></span><span class="dl-l" title="${esc(r.label)}">${esc(r.label)}</span><b>${r.n}</b></div>`).join('')}</div></div>`;
}
function widgetCard(w){
  const cfg = w.config||{};
  let body='';
  if(w.wtype==='stat'){
    const rows = widgetTaskRows(cfg);
    const danger = ['overdue','sla'].includes(cfg.show);
    body = `<div class="w-stat ${danger&&rows.length?'red':''}">${rows.length}</div><div class="w-stat-l">${esc(cfg.entity==='requests'?'requests':'tasks')}</div>`;
  }
  else if(w.wtype==='bar') body = hbars(widgetGroups(cfg));
  else if(w.wtype==='donut') body = donutSVG(widgetGroups(cfg));
  else if(w.wtype==='progress'){
    const c=S._dashCtx, total=c.tasks.length, done=c.doneTasks.length;
    const pct = total? Math.round(done/total*100):0;
    body = `<div class="w-stat accent">${pct}%</div><div class="w-stat-l">${done} of ${total} tasks done</div>
      <div class="prog-bar" style="margin-top:10px"><div class="prog-fill" style="width:${pct}%"></div></div>`;
  }
  else if(w.wtype==='list'){
    let rows = widgetTaskRows(cfg);
    if(cfg.entity==='requests') rows=[...rows].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,6);
    else rows=[...rows].sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')).slice(0,6);
    body = rows.length? (cfg.entity==='requests'? requestTable(rows): taskTable(rows)) : '<div style="color:var(--ink3);font-size:13px;padding:8px 0">Nothing here</div>';
  }
  return `<div class="card widget-card ${w.wtype==='list'?'w-wide':''}" draggable="true" data-wid="${w.id}"
      ondragstart="wDragStart(event,'${w.id}')" ondragover="event.preventDefault()" ondrop="wDrop(event,'${w.id}')">
    <div class="w-head"><h3>${esc(w.title)}</h3>
      <span class="w-actions"><span onclick="widgetModal('${w.id}')">Edit</span><span onclick="deleteWidget('${w.id}')">Remove</span></span></div>
    ${body}</div>`;
}
let wDragId=null;
function wDragStart(e,id){ wDragId=id; }
async function wDrop(e,targetId){
  e.preventDefault();
  if(!wDragId || wDragId===targetId) return;
  const ws=S._widgets, from=ws.findIndex(x=>x.id===wDragId), to=ws.findIndex(x=>x.id===targetId);
  if(from<0||to<0) return;
  const [m]=ws.splice(from,1); ws.splice(to,0,m); wDragId=null;
  document.getElementById('wgrid').innerHTML = ws.map(widgetCard).join('');
  for(let i=0;i<ws.length;i++){ if(ws[i].position!==i){ ws[i].position=i; await db.from('dashboard_widgets').update({position:i}).eq('id',ws[i].id); } }
}
async function deleteWidget(id){
  const {error}=await db.from('dashboard_widgets').delete().eq('id',id);
  if(error) return toast(error.message,true);
  S._widgets = S._widgets.filter(w=>w.id!==id);
  document.getElementById('wgrid').innerHTML = S._widgets.map(widgetCard).join('') || `<div class="card empty" style="grid-column:1/-1">No widgets yet — add your first one.</div>`;
  toast('Widget removed');
}
function widgetModal(id){
  const w = id? S._widgets.find(x=>x.id===id): null;

    <div class="modal-body">
      <label>Widget type</label>
      <div class="type-pick" id="wm-type">${types.map(([k,l,d])=>`<div class="tp ${ (w?w.wtype:'bar')===k?'sel':''}" data-k="${k}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('sel'));this.classList.add('sel');wmRefresh()"><b>${l}</b><span>${d}</span></div>`).join('')}</div>

      </div>

      <p style="color:var(--ink3);font-size:12.5px;margin-top:10px">Widgets follow the workspace selector at the top of the dashboard.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="wm-save">${w?'Save':'Add widget'}</button></div>`);
  window.wmRefresh = ()=>{
    const t = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const ent = m.querySelector('#wm-entity').value;
    const dim = m.querySelector('#wm-dim');
    if(t==='bar'||t==='donut'){
      const gs = ent==='requests'? W_GROUPS_REQS: W_GROUPS_TASKS;
      dim.innerHTML = `<label>Group by</label><select id="wm-group">${gs.map(([k,l])=>`<option value="${k}" ${cfg.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>`;
    } else if(t==='stat'||t==='list'){

    } else dim.innerHTML='';
    m.querySelector('#wm-mine-wrap').style.display = (ent==='tasks' && (t==='stat'||t==='list'))? 'flex':'none';
  };
  wmRefresh();
  m.querySelector('#wm-save').onclick = async ()=>{
    const wtype = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const entity = m.querySelector('#wm-entity').value;
    const config = {entity};
    if(wtype==='bar'||wtype==='donut') config.groupBy = m.querySelector('#wm-group')?.value || 'status';
    if(wtype==='stat'||wtype==='list'){ config.show = m.querySelector('#wm-show')?.value || 'open'; config.mine = m.querySelector('#wm-mine')?.checked || false; }
    let title = m.querySelector('#wm-title').value.trim();
    if(!title){
      const dimL = config.groupBy? ' by '+config.groupBy : config.show? ' — '+config.show : '';
      title = (entity==='requests'?'Requests':'Tasks') + dimL;
    }
    let error;
    if(w){ ({error} = await db.from('dashboard_widgets').update({wtype, title, config}).eq('id',w.id)); }
    else { ({error} = await db.from('dashboard_widgets').insert({user_id:S.me.id, wtype, title, config, position:(S._widgets||[]).length})); }
    if(error) return toast(error.message,true);
    closeModals(); toast(w?'Widget updated':'Widget added'); renderDashboard();
  };
}
function hbars(rows){
  if(!rows.length) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const max = Math.max(...rows.map(r=>r.n));
  return rows.map(r=>`<div class="hbar-row">
    <div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(r.n/max*100)}%;background:${r.color}"></div></div>
    <div class="hbar-val">${r.n}</div></div>`).join('');
}

  const t = id? (window._allTypes||[]).find(x=>x.id===id) : null;
  const FT=['text','textarea','number','date','select','multiselect','brand'];
  const wsOpts = (sel)=>'<option value="">— all staff (no routing) —</option>'+S.workspaces.map(w=>`<option value="${w.id}" ${w.id===sel?'selected':''}>${esc(w.name)}</option>`).join('');
  const fieldRow = (f)=>`<div class="tf-row" data-key="${esc(f?.key||'')}" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
    <input data-fr="label" placeholder="Label" value="${esc(f?.label||'')}" style="flex:2">
    <select data-fr="type" style="flex:1;width:auto">${FT.map(x=>`<option ${x===(f?.type||'text')?'selected':''}>${x}</option>`).join('')}</select>
    <input data-fr="options" placeholder="Options (comma)" value="${esc((f?.options||[]).join(', '))}" style="flex:2">
    <label style="display:flex;align-items:center;gap:4px;margin:0;font-size:11px">Req<input type="checkbox" data-fr="required" ${f?.required?'checked':''} style="width:14px;height:14px"></label>
    <button onclick="this.parentElement.remove()" style="color:var(--ink3)">✕</button></div>`;
  window._tyFieldRow = fieldRow;
  const m = modal(`<div class="modal-head"><h2>${t?'Edit':'New'} request type</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Name <span class="req">*</span></label><input id="ty-name" value="${esc(t?.name||'')}">
      <label>Description</label><input id="ty-desc" value="${esc(t?.description||'')}">
      <div class="field-grid">
        <div><label>SLA (hours)</label><input id="ty-sla" type="number" value="${t?.sla_hours??48}"></div>
        <div><label>Routes to workspace</label><select id="ty-ws">${wsOpts(t?.default_workspace_id)}</select></div>
      </div>
      <div style="display:flex;gap:22px;margin-top:14px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:7px;margin:0;color:var(--ink)"><input type="checkbox" id="ty-appr" ${t?.approval_required?'checked':''} style="width:15px;height:15px">Requires approval</label>
        <label style="display:flex;align-items:center;gap:7px;margin:0;color:var(--ink)"><input type="checkbox" id="ty-pub" ${t?.public_enabled?'checked':''} style="width:15px;height:15px">Public form link</label>
      </div>
      ${t?.public_token? `<div style="margin-top:10px;font-size:12px;color:var(--ink2);word-break:break-all">Form link: <a href="${location.origin+location.pathname}#/f/${t.public_token}" target="_blank" rel="noopener">${location.origin+location.pathname}#/f/${t.public_token}</a></div>`:''}
      <label>Form fields</label>
      <div id="ty-fields">${(t?.fields||[]).map(fieldRow).join('')}</div>
      <button class="btn btn-ghost btn-sm" id="ty-addf" style="margin-top:6px">＋ Add field</button>
    </div>
    <div class="modal-foot">
      ${t? `<button class="btn btn-ghost" id="ty-toggle">${t.active?'Deactivate':'Activate'}</button>`:''}
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" id="ty-save">Save</button></div>`, true);
  m.querySelector('#ty-addf').onclick = ()=> m.querySelector('#ty-fields').insertAdjacentHTML('beforeend', fieldRow(null));
  m.querySelector('#ty-toggle')?.addEventListener('click', async ()=>{
    const {error} = await db.from('request_types').update({active:!t.active}).eq('id',t.id);
    if(error) return toast(error.message, true);
    closeModals(); toast(t.active?'Type deactivated':'Type activated'); await refreshCore(); renderAdmin();
  });
  m.querySelector('#ty-save').onclick = async ()=>{
    const name = m.querySelector('#ty-name').value.trim(); if(!name) return toast('Name required', true);
    const fields = [...m.querySelectorAll('.tf-row')].map(r=>{
      const label=r.querySelector('[data-fr=label]').value.trim();
      if(!label) return null;
      const type=r.querySelector('[data-fr=type]').value;
      const options=r.querySelector('[data-fr=options]').value.split(',').map(s=>s.trim()).filter(Boolean);
      const required=r.querySelector('[data-fr=required]').checked;
      const key = r.dataset.key || label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || ('f'+Math.random().toString(36).slice(2,6));
      const f={key,label,type,required};
      if(type==='select'||type==='multiselect') f.options=options;
      return f;
    }).filter(Boolean);
    const payload = {name, description:m.querySelector('#ty-desc').value.trim(), sla_hours:parseInt(m.querySelector('#ty-sla').value)||48,
      default_workspace_id:m.querySelector('#ty-ws').value||null, approval_required:m.querySelector('#ty-appr').checked,
      public_enabled:m.querySelector('#ty-pub').checked, fields};
    let error;
    if(t) ({error} = await db.from('request_types').update(payload).eq('id',t.id));
    else ({error} = await db.from('request_types').insert(Object.assign({}, payload, {position:100})));
    if(error) return toast(error.message, true);
    closeModals(); toast('Request type saved'); await refreshCore(); renderAdmin();
  };
}
async function toggleBrand(id, active){
  const {error} = await db.from('brands').update({active}).eq('id',id);
  if(error) return toast(error.message, true);
  toast(active?'Brand reactivated':'Brand offboarded'); await refreshCore(); renderAdmin();
}
async function setRole(uid, role){
  const {error} = await db.from('profiles').update({role}).eq('id',uid);
  if(error) return toast(error.message, true);
  toast('Role updated'); await refreshCore();
}
async function toggleActive(uid, active){
  const {error} = await db.from('profiles').update({active}).eq('id',uid);
  if(error) return toast(error.message, true);
  toast(active?'User activated':'User deactivated'); await refreshCore(); renderAdmin();
}
async function resetPassword(uid, name){
  const p = prompt(`New temporary password for ${name}:`, 'Crea'+Math.random().toString(36).slice(2,8)+'!');
  if(!p || p.length<8) return;
  try{
    const res = await fetch(ADMIN_API+'/reset-password', {method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.session.access_token, 'apikey':SUPABASE_ANON},
      body:JSON.stringify({user_id:uid, password:p})});
    const out = await res.json();
    if(!res.ok) throw new Error(out.error||'Failed');
    toast('Password reset — share it with them');
  }catch(e){ toast(e.message, true); }
}
const WS_COLORS=['#0F766E','#3E5C95','#8C5A3B','#5A6B4F','#6E56B8','#A8770E','#7D3C55','#C2434F','#12915E','#2B6CB0'];
function wsMenu(anchor, wid){
  const w = wsById(wid); if(!w) return;
  const items = [{label:'Rename / edit', fn:()=>editWorkspaceModal(wid)},
                 {label:'Members', fn:()=>teamMembersModal(wid)}];
  if(isAdmin()){ items.push('-'); items.push({label:'Delete workspace', danger:true, fn:()=>deleteWorkspaceModal(wid)}); }
  ctxMenu(anchor, items);
}
function editWorkspaceModal(wid){
  const w = wsById(wid); if(!w) return;
  const m = modal(`<div class="modal-head"><h2>Edit workspace</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Name <span class="req">*</span></label><input id="ew-name" value="${esc(w.name)}">
      <label>Description</label><input id="ew-desc" value="${esc(w.description||'')}">
      <label>Colour</label>
      <div id="ew-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        ${WS_COLORS.map(c=>`<span data-c="${c}" style="width:26px;height:26px;border-radius:50%;background:${c};cursor:pointer;box-shadow:${c===w.color?'0 0 0 3px #fff,0 0 0 5px '+c:'none'}"></span>`).join('')}
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="ew-save">Save</button></div>`);
  let colour = w.color;
  m.querySelectorAll('#ew-cols span').forEach(s=> s.onclick=()=>{
    colour = s.dataset.c;
    m.querySelectorAll('#ew-cols span').forEach(x=> x.style.boxShadow = x.dataset.c===colour? '0 0 0 3px #fff,0 0 0 5px '+colour : 'none');
  });
  m.querySelector('#ew-save').onclick = async ()=>{
    const name = m.querySelector('#ew-name').value.trim(); if(!name) return toast('Name required', true);
    const {error} = await db.from('workspaces').update({name, description:m.querySelector('#ew-desc').value.trim(), color:colour}).eq('id',wid);
    if(error) return toast(error.message, true);
    closeModals(); toast('Workspace updated'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin(); else if(S.route.view==='ws') renderWorkspace(wid);
  };
}
async function deleteWorkspaceModal(wid){
  const w = wsById(wid); if(!w) return;
  if(!isAdmin()) return toast('Only an admin can delete a workspace', true);
  const projs = S.projects.filter(p=>p.workspace_id===wid);
  let nTasks = 0;
  if(projs.length){
    const {count} = await db.from('tasks').select('id',{count:'exact',head:true}).in('project_id', projs.map(p=>p.id));
    nTasks = count||0;
  }
  const m = modal(`<div class="modal-head"><h2>Delete “${esc(w.name)}”?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="danger-note"><b>This cannot be undone.</b> Deleting this workspace also deletes everything inside it.</div>
      <div style="display:flex;gap:26px;margin:14px 0 16px">
        <div><div style="font-size:26px;font-weight:800;line-height:1">${projs.length}</div><div style="font-size:12px;color:var(--ink3)">project${projs.length===1?'':'s'}</div></div>
        <div><div style="font-size:26px;font-weight:800;line-height:1;color:${nTasks?'var(--red)':'inherit'}">${nTasks}</div><div style="font-size:12px;color:var(--ink3)">task${nTasks===1?'':'s'}</div></div>
      </div>
      ${projs.length? `<div style="font-size:13px;color:var(--ink2);margin-bottom:14px">Projects that will go: ${projs.slice(0,6).map(p=>'<b>'+esc(p.name)+'</b>').join(', ')}${projs.length>6?' and '+(projs.length-6)+' more':''}.</div>`:''}
      <label>Type the workspace name to confirm</label>
      <input id="dw-confirm" autocomplete="off" placeholder="${esc(w.name)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-danger" id="dw-go" disabled>Delete workspace</button></div>`);
  const inp=m.querySelector('#dw-confirm'), go=m.querySelector('#dw-go');
  inp.oninput = ()=>{ go.disabled = inp.value.trim().toLowerCase() !== w.name.trim().toLowerCase(); };
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {error} = await db.from('workspaces').delete().eq('id',wid);
    if(error){ go.disabled=false; go.textContent='Delete workspace'; return toast(error.message, true); }
    logActivity('workspace', wid, 'delete', {name:w.name, projects:projs.length, tasks:nTasks});
    closeModals(); toast('Workspace deleted'); await refreshCore();
    if(S.route.view==='ws' && S.route.id===wid) location.hash='#/home'; else { renderSidebar(); if(S.route.view==='admin') renderAdmin(); }
  };
  setTimeout(()=>inp.focus(), 30);
}
function newWorkspaceModal(){
  const m = modal(`<div class="modal-head"><h2>New workspace</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Workspace name <span class="req">*</span></label><input id="nw-name" placeholder="e.g. Livestream Squad">
      <label>Description</label><input id="nw-desc">
      <p style="margin-top:12px;font-size:12.5px;color:var(--ink2)">You'll be added as a member automatically. Add colleagues from the workspace page → Members.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="nw-save">Create workspace</button></div>`);
  m.querySelector('#nw-save').onclick = async ()=>{
    const name=m.querySelector('#nw-name').value.trim(); if(!name) return toast('Name required', true);
    const colors=['#0F766E','#3E5C95','#8C5A3B','#5A6B4F','#6E56B8','#A8770E','#7D3C55'];
    const {data, error} = await db.from('workspaces').insert({name,
      description:m.querySelector('#nw-desc').value.trim(), color:colors[Math.floor(Math.random()*colors.length)],
      position:S.workspaces.length+1}).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Workspace created'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin(); else if(data) location.hash='#/ws/'+data.id;
  };
}

/* ================= PLATFORM (SaaS console) ================= */
async function renderPlatform(){
  if(!S.me.platform_admin){ location.hash='#/home'; return; }
  setTopbar('Platform');
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const [{data:cos}, {data:pf}] = await Promise.all([
    db.from('companies').select('*').order('created_at'),
    db.from('profiles').select('id, company_id, active'),
  ]);
  const counts = {};
  (pf||[]).forEach(p=>{ if(p.company_id && p.active){ counts[p.company_id]=(counts[p.company_id]||0)+1; } });
  const PLANS=['internal','trial','starter','pro','enterprise'];
  const STATS=['trial','active','past_due','suspended','cancelled'];
  C.innerHTML = `
    <div class="page-head"><div><h1>Platform</h1><div class="sub">Customer companies, plans and subscription status</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n accent">${(cos||[]).length}</div><div class="l">Companies</div></div>
      <div class="stat"><div class="n green">${(cos||[]).filter(c=>c.status==='active').length}</div><div class="l">Active subscriptions</div></div>
      <div class="stat"><div class="n amber">${(cos||[]).filter(c=>c.status==='trial').length}</div><div class="l">On trial</div></div>
      <div class="stat"><div class="n">${(pf||[]).filter(p=>p.active).length}</div><div class="l">Total active users</div></div>
    </div>
    <div class="card"><table class="tbl"><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Seats</th><th>Users</th><th>Trial ends</th><th></th></tr></thead><tbody>
    ${(cos||[]).map(c=>`<tr id="co-${c.id}">
      <td style="font-weight:600">${esc(c.name)}<div style="font-size:11px;color:var(--ink3)">${esc(c.slug||'')} · since ${fmtDate(c.created_at)}</div></td>
      <td><select data-k="plan" style="width:auto;padding:5px 8px">${PLANS.map(p=>`<option ${p===c.plan?'selected':''}>${p}</option>`).join('')}</select></td>
      <td><select data-k="status" style="width:auto;padding:5px 8px">${STATS.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><input data-k="seats" type="number" value="${c.seats}" style="width:70px;padding:5px 8px"></td>
      <td>${counts[c.id]||0}</td>
      <td style="color:var(--ink2)">${c.trial_ends_at? fmtDate(c.trial_ends_at):'—'}</td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="savePlatformCo('${c.id}')">Save</button></td>
    </tr>`).join('')}</tbody></table></div>
    <p style="margin-top:12px;font-size:12.5px;color:var(--ink2)">Billing is manual for now — set plan/status here when a customer pays (or stops paying). Suspended and cancelled companies are locked out at sign-in. Stripe checkout can be wired in later.</p>`;
}
async function savePlatformCo(id){
  const row = document.getElementById('co-'+id); if(!row) return;
  const plan = row.querySelector('select[data-k=plan]').value;
  const status = row.querySelector('select[data-k=status]').value;
  const seats = parseInt(row.querySelector('input[data-k=seats]').value)||10;
  const {error} = await db.from('companies').update({plan, status, seats}).eq('id',id);
  if(error) return toast(error.message, true);
  toast('Company updated');
}

/* ================= INIT ================= */
(async ()=>{
  if(location.hash.startsWith('#/f/')){ renderPublicForm(location.hash.slice(4).split('?')[0]); return; }
  const {data:{session}} = await db.auth.getSession();
  S.session = session;
  if(session) await boot();
  else $('#login-screen').classList.remove('hidden');
})();
</script>
